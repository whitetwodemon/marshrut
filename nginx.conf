# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;
    charset utf-8;
    source_charset utf-8;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/html;
    index index.html;
    charset_types text/html text/plain text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Type "text/html; charset=utf-8";
    }

    location /api/ {
        fastcgi_pass  php:9000;
        fastcgi_index index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param  REQUEST_URI     $request_uri;
        fastcgi_param  QUERY_STRING    $query_string;
        fastcgi_param  REQUEST_METHOD  $request_method;
        fastcgi_param  CONTENT_TYPE    $content_type;
        fastcgi_param  CONTENT_LENGTH  $content_length;
        fastcgi_param  HTTPS           on;
    }

    # SSE endpoint — отключаем буферизацию для мгновенного push
    location /api/events {
        fastcgi_pass           php:9000;
        fastcgi_index          index.php;
        include                fastcgi_params;
        fastcgi_param          SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param          REQUEST_URI     $request_uri;
        fastcgi_param          QUERY_STRING    $query_string;
        fastcgi_param          REQUEST_METHOD  GET;
        fastcgi_param          HTTPS           on;
        fastcgi_read_timeout   70s;
        fastcgi_buffering      off;
        proxy_buffering        off;
        proxy_cache            off;
        chunked_transfer_encoding on;
    }

    location /health {
        fastcgi_pass  php:9000;
        fastcgi_index index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param  REQUEST_URI     /health;
        fastcgi_param  REQUEST_METHOD  GET;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Permissions-Policy "camera=*";
    add_header Strict-Transport-Security "max-age=31536000" always;
}
