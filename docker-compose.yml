services:

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
      - "${APP_HTTPS_PORT:-8443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - app

  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST:        mysql
      DB_PORT:        "3306"
      DB_NAME:        ${DB_NAME:-marshrut}
      DB_USER:        ${DB_USER:-marshrut}
      DB_PASSWORD:    ${DB_PASSWORD:-marshrut}
      JWT_SECRET:     ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN:    ${CORS_ORIGIN:-*}
      ADMIN_EMAIL:    ${ADMIN_EMAIL:-admin@marshrut.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
      ADMIN_NAME:     ${ADMIN_NAME:-Admin}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app

  mysql:
    build:
      context: .
      dockerfile: docker/mysql.Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE:      ${DB_NAME:-marshrut}
      MYSQL_USER:          ${DB_USER:-marshrut}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-marshrut}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - app

  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST:     mysql
      DB_NAME:     ${DB_NAME:-marshrut}
      DB_USER:     ${DB_USER:-marshrut}
      DB_PASSWORD: ${DB_PASSWORD:-marshrut}
    volumes:
      - ./backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app

volumes:
  mysql_data:

networks:
  app:
