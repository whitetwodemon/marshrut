services:

  mysql:
    image: mysql:8.0
    container_name: marshrut-mysql
    restart: unless-stopped
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --character-set-client-handshake=ON
      --init-connect='SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE:      ${DB_NAME:-marshrut}
      MYSQL_USER:          ${DB_USER:-marshrut}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-marshrut}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marshrut-php
    restart: unless-stopped
    environment:
      DB_HOST:        mysql
      DB_PORT:        3306
      DB_NAME:        ${DB_NAME:-marshrut}
      DB_USER:        ${DB_USER:-marshrut}
      DB_PASSWORD:    ${DB_PASSWORD:-marshrut}
      JWT_SECRET:     ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      CORS_ORIGIN:    ${CORS_ORIGIN:-*}
      ADMIN_EMAIL:    ${ADMIN_EMAIL:-admin@marshrut.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
      ADMIN_NAME:     ${ADMIN_NAME:-Администратор}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal

  # ── Frontend builder (Node/Vite) — runs once and exits ────────────
  frontend-build:
    image: node:20-alpine
    container_name: marshrut-frontend-build
    working_dir: /app
    volumes:
      - ./frontend-src:/app
      - ./frontend:/dist
    command: sh -c "npm install --silent && npm run build -- --outDir /dist"
    profiles:
      - build  # запускается только явно: docker compose --profile build up frontend-build

  nginx:
    image: nginx:alpine
    container_name: marshrut-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
      - "${APP_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/var/www/html:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - php
    networks:
      - internal
      - external

volumes:
  mysql_data:

networks:
  internal:
  external:
