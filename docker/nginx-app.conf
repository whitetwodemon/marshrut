server {
    listen 80;
    server_name _;
    charset utf-8;

    root  /var/www/html;
    index index.html;

    add_header X-Content-Type-Options  nosniff always;
    add_header X-Frame-Options         SAMEORIGIN always;
    add_header Permissions-Policy      "camera=*" always;

    # Кэш статики с хэшем в имени (никогда не устаревает)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        fastcgi_pass  php:9000;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_param REQUEST_METHOD  $request_method;
        fastcgi_param CONTENT_TYPE    $content_type;
        fastcgi_param CONTENT_LENGTH  $content_length;
        fastcgi_param HTTPS           on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    location /api/events {
        fastcgi_pass         php:9000;
        include              fastcgi_params;
        fastcgi_param        SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param        REQUEST_URI     $request_uri;
        fastcgi_param        REQUEST_METHOD  GET;
        fastcgi_param        HTTPS           on;
        fastcgi_read_timeout 70s;
        fastcgi_buffering    off;
        proxy_buffering      off;
        chunked_transfer_encoding on;
    }

    location /health {
        fastcgi_pass  php:9000;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param REQUEST_URI     /health;
        fastcgi_param REQUEST_METHOD  GET;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
