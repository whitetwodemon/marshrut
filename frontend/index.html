<!doctype html>
<html lang="ru" data-theme="dark" data-density="compact">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#14110b" />
  <title>Маршрут — система производственных маршрутных листов</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
/* Touch оптимизации */
* { -webkit-tap-highlight-color: transparent; }
body { overscroll-behavior: none; }
input, select, textarea { touch-action: manipulation; }
.btn, .icon-btn, .mobile-nav-item, button { touch-action: manipulation; }
html { height: -webkit-fill-available; }
body { min-height: -webkit-fill-available; }

/* =========================================================================
   Маршрут / Дизайн-система
   ========================================================================= */

:root {
  /* Type */
  --ui-font: "Inter Tight", "Inter", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono-font: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  /* ---- Light (default workshop) ---- */
  --bg-0: #f4f1ec;          /* page */
  --bg-1: #fbf9f5;          /* panel */
  --bg-2: #ffffff;          /* card */
  --bg-3: #efeae1;          /* sunken row */
  --bg-hover: rgba(20, 16, 8, 0.04);
  --bg-active: rgba(20, 16, 8, 0.08);

  --fg-0: #18130b;          /* primary text */
  --fg-1: #4a4339;          /* secondary */
  --fg-2: #87807a;          /* tertiary / meta */
  --fg-3: #b8b1a8;          /* placeholder */

  --line-1: rgba(20, 16, 8, 0.10);
  --line-2: rgba(20, 16, 8, 0.06);
  --line-strong: rgba(20, 16, 8, 0.18);

  /* Industrial amber/orange */
  --accent: #d9480f;
  --accent-2: #f08c1c;
  --accent-soft: #fbe6d3;
  --accent-fg: #4a1a04;

  /* Status */
  --st-wait-bg: #efe7d6;
  --st-wait-fg: #6a5310;
  --st-wait-line: #b88f1f;

  --st-prog-bg: #ddead3;
  --st-prog-fg: #2f5418;
  --st-prog-line: #4a8728;

  --st-done-bg: #d6e3d2;
  --st-done-fg: #244018;
  --st-done-line: #2f6a23;

  --st-warn-bg: #f2dcc0;
  --st-warn-fg: #6b3b09;
  --st-warn-line: #c97316;

  --st-block-bg: #ecd2d2;
  --st-block-fg: #621414;
  --st-block-line: #a82a2a;

  --shadow-1: 0 1px 0 rgba(20, 16, 8, 0.04), 0 1px 2px rgba(20, 16, 8, 0.04);
  --shadow-2: 0 1px 0 rgba(20, 16, 8, 0.05), 0 4px 14px rgba(20, 16, 8, 0.06);
  --shadow-pop: 0 1px 0 rgba(20, 16, 8, 0.06), 0 12px 40px rgba(20, 16, 8, 0.18);

  /* Density (default = compact ERP) */
  --density-row: 30px;
  --density-pad-x: 10px;
  --density-pad-y: 6px;
  --density-gap: 8px;
  --density-card-pad: 14px;
  --density-section-gap: 14px;
  --density-fs-1: 12.5px;
  --density-fs-2: 11px;
  --density-fs-3: 10.5px;
  --density-fs-head: 14px;
  --density-fs-title: 18px;
}

[data-theme="dark"] {
  --bg-0: #131210;
  --bg-1: #1a1916;
  --bg-2: #21201c;
  --bg-3: #181714;
  --bg-hover: rgba(255, 248, 230, 0.04);
  --bg-active: rgba(255, 248, 230, 0.08);

  --fg-0: #f3eee2;
  --fg-1: #b9b3a4;
  --fg-2: #847e72;
  --fg-3: #56524a;

  --line-1: rgba(255, 248, 230, 0.08);
  --line-2: rgba(255, 248, 230, 0.05);
  --line-strong: rgba(255, 248, 230, 0.18);

  --accent: #f08c1c;
  --accent-2: #ffb547;
  --accent-soft: rgba(240, 140, 28, 0.18);
  --accent-fg: #ffd9a8;

  --st-wait-bg: rgba(186, 142, 31, 0.18);
  --st-wait-fg: #f0c75a;
  --st-wait-line: rgba(186, 142, 31, 0.5);

  --st-prog-bg: rgba(74, 135, 40, 0.22);
  --st-prog-fg: #aede89;
  --st-prog-line: rgba(74, 135, 40, 0.6);

  --st-done-bg: rgba(47, 106, 35, 0.22);
  --st-done-fg: #97c789;
  --st-done-line: rgba(47, 106, 35, 0.5);

  --st-warn-bg: rgba(201, 115, 22, 0.18);
  --st-warn-fg: #ffb579;
  --st-warn-line: rgba(201, 115, 22, 0.5);

  --st-block-bg: rgba(168, 42, 42, 0.22);
  --st-block-fg: #f08585;
  --st-block-line: rgba(168, 42, 42, 0.6);

  --shadow-1: 0 1px 0 rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-2: 0 1px 0 rgba(0, 0, 0, 0.5), 0 4px 14px rgba(0, 0, 0, 0.4);
  --shadow-pop: 0 1px 0 rgba(0, 0, 0, 0.6), 0 12px 40px rgba(0, 0, 0, 0.6);
}

[data-theme="industrial"] {
  /* High-contrast cool concrete — looks like a shop-floor terminal */
  --bg-0: #0b0e10;
  --bg-1: #14181b;
  --bg-2: #1a1f22;
  --bg-3: #11151a;
  --bg-hover: rgba(220, 230, 240, 0.05);
  --bg-active: rgba(220, 230, 240, 0.1);

  --fg-0: #e6ebef;
  --fg-1: #99a3ad;
  --fg-2: #6a7480;
  --fg-3: #44505c;

  --line-1: rgba(180, 200, 220, 0.1);
  --line-2: rgba(180, 200, 220, 0.06);
  --line-strong: rgba(180, 200, 220, 0.2);

  --accent: #ff7a18;
  --accent-2: #ffb700;
  --accent-soft: rgba(255, 122, 24, 0.16);
  --accent-fg: #ffd9a8;

  --st-wait-bg: rgba(255, 183, 0, 0.14);
  --st-wait-fg: #ffd34a;
  --st-wait-line: rgba(255, 183, 0, 0.5);

  --st-prog-bg: rgba(0, 200, 130, 0.14);
  --st-prog-fg: #79e3b0;
  --st-prog-line: rgba(0, 200, 130, 0.5);

  --st-done-bg: rgba(100, 130, 100, 0.18);
  --st-done-fg: #b4c8a8;
  --st-done-line: rgba(100, 130, 100, 0.45);

  --st-warn-bg: rgba(255, 122, 24, 0.16);
  --st-warn-fg: #ffb579;
  --st-warn-line: rgba(255, 122, 24, 0.5);

  --st-block-bg: rgba(232, 70, 70, 0.16);
  --st-block-fg: #ff8a8a;
  --st-block-line: rgba(232, 70, 70, 0.55);

  --shadow-1: 0 1px 0 rgba(0, 0, 0, 0.6);
  --shadow-2: 0 1px 0 rgba(0, 0, 0, 0.6), 0 6px 20px rgba(0, 0, 0, 0.5);
  --shadow-pop: 0 1px 0 rgba(0, 0, 0, 0.7), 0 16px 50px rgba(0, 0, 0, 0.7);
}

[data-density="airy"] {
  --density-row: 44px;
  --density-pad-x: 16px;
  --density-pad-y: 12px;
  --density-gap: 14px;
  --density-card-pad: 22px;
  --density-section-gap: 22px;
  --density-fs-1: 14px;
  --density-fs-2: 12.5px;
  --density-fs-3: 11.5px;
  --density-fs-head: 16px;
  --density-fs-title: 22px;
}

/* =========================================================================
   Reset + base
   ========================================================================= */
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body {
  font-family: var(--ui-font);
  font-size: var(--density-fs-1);
  color: var(--fg-0);
  background: var(--bg-0);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv11", "ss01";
}
button { font-family: inherit; }
.mono { font-family: var(--mono-font); font-feature-settings: normal; }
.num { font-variant-numeric: tabular-nums; }

/* =========================================================================
   App shell
   ========================================================================= */
.app {
  display: grid;
  grid-template-columns: 220px 1fr;
  grid-template-rows: 100vh;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
[data-density="airy"] .app { grid-template-columns: 240px 1fr; }

.sidebar {
  background: var(--bg-1);
  border-right: 1px solid var(--line-1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-head {
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--line-2);
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-mark {
  width: 26px;
  height: 26px;
  border-radius: 5px;
  background: var(--accent);
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.02em;
  position: relative;
}
.brand-mark::after {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1.5px dashed rgba(255,255,255,0.55);
  border-radius: 3px;
}
.brand-name {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.brand-sub {
  font-size: 9.5px;
  color: var(--fg-2);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 1px;
}

.sidebar-section {
  padding: 12px 10px 4px;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-2);
}
.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 0 6px;
}
.nav-item {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 7px 8px;
  border-radius: 5px;
  cursor: pointer;
  font-size: var(--density-fs-1);
  color: var(--fg-1);
  border: 0;
  background: transparent;
  text-align: left;
}
.nav-item:hover { background: var(--bg-hover); color: var(--fg-0); }
.nav-item.active {
  background: var(--accent-soft);
  color: var(--accent-fg);
  font-weight: 500;
}
[data-theme="light"] .nav-item.active,
:root:not([data-theme]) .nav-item.active { color: var(--accent); }
.nav-item .ico { color: var(--fg-2); }
.nav-item.active .ico { color: var(--accent); }
.nav-item .badge {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--bg-3);
  color: var(--fg-1);
}

.sidebar-foot {
  margin-top: auto;
  border-top: 1px solid var(--line-2);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: var(--density-fs-2);
  color: var(--fg-1);
}
.avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, #c44 0%, #a82 100%);
  display: grid; place-items: center;
  color: #fff;
  font-size: 11px;
  font-weight: 600;
}

/* =========================================================================
   Main pane
   ========================================================================= */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-0);
}
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 18px;
  height: 44px;
  border-bottom: 1px solid var(--line-1);
  background: var(--bg-1);
  flex-shrink: 0;
}
[data-density="airy"] .topbar { height: 56px; padding: 0 24px; }
.crumbs {
  font-size: var(--density-fs-2);
  color: var(--fg-2);
  display: flex;
  align-items: center;
  gap: 6px;
}
.crumbs b { color: var(--fg-0); font-weight: 600; }
.crumbs .sep { color: var(--fg-3); }
.topbar-spacer { flex: 1; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }

.scroller {
  flex: 1;
  overflow-y: auto;
  padding: 16px 18px 24px;
}
[data-density="airy"] .scroller { padding: 24px 28px 36px; }

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: var(--density-section-gap);
}
.page-title {
  font-size: var(--density-fs-title);
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
}
.page-sub {
  font-size: var(--density-fs-2);
  color: var(--fg-2);
  margin-top: 4px;
}

/* =========================================================================
   Buttons
   ========================================================================= */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line-strong);
  background: var(--bg-2);
  color: var(--fg-0);
  padding: 5px 10px;
  border-radius: 5px;
  font-size: var(--density-fs-2);
  font-weight: 500;
  cursor: pointer;
  line-height: 1;
  height: 28px;
  transition: background .12s;
}
[data-density="airy"] .btn { height: 34px; padding: 7px 14px; font-size: var(--density-fs-1); }
.btn:hover { background: var(--bg-hover); }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn.primary:hover { background: #b83b08; }
[data-theme="dark"] .btn.primary:hover,
[data-theme="industrial"] .btn.primary:hover { background: #ffa14a; }
.btn.ghost {
  background: transparent;
  border-color: transparent;
}
.btn.ghost:hover { background: var(--bg-hover); }
.btn .ico { color: currentColor; }
.btn.small { height: 24px; padding: 3px 8px; font-size: 10.5px; }

/* =========================================================================
   Inputs
   ========================================================================= */
.input, .select {
  height: 28px;
  border: 1px solid var(--line-strong);
  background: var(--bg-2);
  color: var(--fg-0);
  border-radius: 5px;
  padding: 0 9px;
  font-family: inherit;
  font-size: var(--density-fs-2);
  outline: none;
}
[data-density="airy"] .input, [data-density="airy"] .select { height: 34px; font-size: var(--density-fs-1); }
.input:focus, .select:focus { border-color: var(--accent); }
.input.mono { font-family: var(--mono-font); }
.field {
  display: flex; flex-direction: column;
  gap: 4px;
}
.field-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-2);
}

/* =========================================================================
   Cards / panels
   ========================================================================= */
.card {
  background: var(--bg-2);
  border: 1px solid var(--line-1);
  border-radius: 8px;
  box-shadow: var(--shadow-1);
  padding: var(--density-card-pad);
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.card-title {
  font-size: var(--density-fs-head);
  font-weight: 600;
  letter-spacing: -0.005em;
  margin: 0;
}
.card-sub {
  font-size: var(--density-fs-2);
  color: var(--fg-2);
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line-1);
  background: var(--bg-1);
  border-radius: 8px 8px 0 0;
}
[data-density="airy"] .toolbar { padding: 12px 18px; }

/* =========================================================================
   Tables
   ========================================================================= */
.tbl-wrap {
  background: var(--bg-2);
  border: 1px solid var(--line-1);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow-1);
}
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--density-fs-2);
  font-variant-numeric: tabular-nums;
}
.tbl th {
  text-align: left;
  font-weight: 600;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-2);
  background: var(--bg-1);
  border-bottom: 1px solid var(--line-1);
  padding: var(--density-pad-y) var(--density-pad-x);
  white-space: nowrap;
}
.tbl td {
  padding: var(--density-pad-y) var(--density-pad-x);
  border-bottom: 1px solid var(--line-2);
  vertical-align: middle;
  height: var(--density-row);
}
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.row-hover:hover { background: var(--bg-hover); }
.tbl .num-col { text-align: right; }
.tbl .mono-col { font-family: var(--mono-font); font-size: 11px; }
.tbl-section-row td {
  background: var(--bg-3);
  font-weight: 600;
  color: var(--fg-0);
  font-size: var(--density-fs-2);
  height: 26px;
  letter-spacing: 0.01em;
}

/* =========================================================================
   Status pills + dots
   ========================================================================= */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  border-radius: 3px;
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.01em;
  white-space: nowrap;
  border: 1px solid transparent;
}
.pill .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor;
}
.pill.wait { background: var(--st-wait-bg); color: var(--st-wait-fg); border-color: var(--st-wait-line); }
.pill.prog { background: var(--st-prog-bg); color: var(--st-prog-fg); border-color: var(--st-prog-line); }
.pill.done { background: var(--st-done-bg); color: var(--st-done-fg); border-color: var(--st-done-line); }
.pill.warn { background: var(--st-warn-bg); color: var(--st-warn-fg); border-color: var(--st-warn-line); }
.pill.block { background: var(--st-block-bg); color: var(--st-block-fg); border-color: var(--st-block-line); }
.pill.neutral { background: var(--bg-3); color: var(--fg-1); border-color: var(--line-1); }

/* =========================================================================
   Layout grids
   ========================================================================= */
.grid-2 {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: var(--density-section-gap);
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--density-section-gap);
}
.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--density-section-gap);
}
.stack {
  display: flex;
  flex-direction: column;
  gap: var(--density-section-gap);
}
.row {
  display: flex;
  align-items: center;
  gap: var(--density-gap);
}

/* =========================================================================
   KPI tiles
   ========================================================================= */
.kpi {
  background: var(--bg-2);
  border: 1px solid var(--line-1);
  border-radius: 8px;
  padding: 12px 14px;
  box-shadow: var(--shadow-1);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
[data-density="airy"] .kpi { padding: 18px 20px; gap: 8px; }
.kpi-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-2);
}
.kpi-value {
  font-size: 26px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--fg-0);
}
[data-density="airy"] .kpi-value { font-size: 32px; }
.kpi-value .unit {
  font-size: 12px;
  font-weight: 500;
  color: var(--fg-2);
  margin-left: 4px;
  letter-spacing: 0;
}
.kpi-meta {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: var(--density-fs-3);
  color: var(--fg-2);
}
.kpi-meta .up { color: var(--st-prog-fg); }
.kpi-meta .dn { color: var(--st-block-fg); }
.kpi.accent {
  background: linear-gradient(180deg, var(--accent), #b83b08);
  color: #fff;
  border-color: var(--accent);
}
.kpi.accent .kpi-label, .kpi.accent .kpi-meta, .kpi.accent .kpi-value, .kpi.accent .unit { color: #fff; }
.kpi.accent .kpi-label { color: rgba(255,255,255,0.85); }
.kpi.accent .unit, .kpi.accent .kpi-meta { color: rgba(255,255,255,0.78); }

/* =========================================================================
   Production board: operation tasks list
   ========================================================================= */
.board-group {
  background: var(--bg-2);
  border: 1px solid var(--line-1);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow-1);
}
.board-group + .board-group { margin-top: 10px; }
.board-grp-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--line-1);
}
[data-density="airy"] .board-grp-head { padding: 14px 18px; }
.board-grp-title {
  font-size: var(--density-fs-head);
  font-weight: 600;
  letter-spacing: -0.005em;
}
.board-grp-code {
  font-family: var(--mono-font);
  font-size: 11px;
  color: var(--fg-2);
  padding: 1px 6px;
  background: var(--bg-3);
  border-radius: 3px;
}
.board-progress {
  flex: 1;
  height: 5px;
  background: var(--bg-3);
  border-radius: 99px;
  overflow: hidden;
  max-width: 240px;
}
.board-progress-fill {
  height: 100%;
  background: var(--st-prog-line);
  transition: width .3s;
}

/* =========================================================================
   Route sheet (printable)
   ========================================================================= */
.routesheet {
  background: #fffdf8;
  color: #14110b;
  border: 1px solid #d8d2c2;
  border-radius: 6px;
  padding: 24px 26px;
  font-family: var(--ui-font);
  box-shadow: var(--shadow-2);
}
[data-theme="dark"] .routesheet, [data-theme="industrial"] .routesheet {
  background: #fffdf8;
  color: #14110b;
}
.rs-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  border-bottom: 2px solid #14110b;
  padding-bottom: 12px;
  margin-bottom: 14px;
}
.rs-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #5a5240;
}
.rs-number {
  font-size: 22px;
  font-weight: 700;
  margin-top: 4px;
  letter-spacing: -0.01em;
}
.rs-meta {
  display: grid;
  grid-template-columns: auto auto;
  column-gap: 12px;
  row-gap: 3px;
  font-size: 11px;
  color: #14110b;
}
.rs-meta .lbl { color: #6e6450; font-weight: 500; }
.rs-detail-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  border-bottom: 1px solid #14110b;
  padding-bottom: 6px;
  margin: 16px 0 8px;
}
.rs-detail-title { font-size: 15px; font-weight: 700; }
.rs-detail-meta { font-size: 10.5px; color: #5a5240; font-family: var(--mono-font); }
.rs-ops {
  width: 100%;
  border-collapse: collapse;
  font-size: 11.5px;
}
.rs-ops th {
  text-align: left;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #5a5240;
  padding: 6px 8px;
  border-bottom: 1px solid #b0a994;
  background: #f7f1e0;
}
.rs-ops td {
  padding: 8px 8px;
  border-bottom: 1px solid #e5dec8;
  vertical-align: middle;
}
.rs-ops .qr-cell {
  text-align: center;
  width: 1%;
  padding: 4px;
}
.rs-ops .qr-cell svg {
  display: block;
  margin: 0 auto;
}
.rs-ops .sign-cell {
  width: 90px;
  border-left: 1px dashed #b0a994;
}
.rs-foot {
  display: flex;
  justify-content: space-between;
  margin-top: 18px;
  padding-top: 10px;
  border-top: 1px solid #b0a994;
  font-size: 10px;
  color: #5a5240;
}

/* =========================================================================
   Scanner (mobile frame)
   ========================================================================= */
.scanner-stage {
  display: grid;
  grid-template-columns: 1.1fr 320px;
  gap: var(--density-section-gap);
  align-items: start;
}
.phone-frame {
  width: 320px;
  height: 660px;
  margin: 0 auto;
  background: #0a0a0a;
  border-radius: 38px;
  padding: 10px;
  box-shadow:
    0 0 0 1.5px #2a2a2a inset,
    0 0 0 2.5px #555,
    0 30px 60px rgba(0, 0, 0, 0.4);
  position: relative;
}
.phone-screen {
  position: relative;
  width: 100%; height: 100%;
  background: #0c0c0c;
  border-radius: 30px;
  overflow: hidden;
  color: #f3eee2;
}
.phone-screen::before {
  content: "";
  position: absolute;
  top: 8px; left: 50%;
  transform: translateX(-50%);
  width: 90px; height: 22px;
  background: #000;
  border-radius: 99px;
  z-index: 10;
}
.scan-statusbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 38px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 22px 0;
  font-size: 11px;
  font-weight: 600;
  color: #f3eee2;
  z-index: 11;
  font-variant-numeric: tabular-nums;
}
.scan-statusbar .icons {
  display: flex; gap: 4px;
  align-items: center;
}

.scan-camview {
  position: absolute;
  inset: 0;
  background: #000;
  overflow: hidden;
}
.scan-camview video, .scan-camview canvas {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.scan-fake {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at center, rgba(255,140,40,0.06) 0%, transparent 60%),
    repeating-linear-gradient(45deg, #1a1a1a 0 8px, #1d1d1d 8px 16px);
  display: grid;
  place-items: center;
  color: #555;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.scan-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  display: flex; flex-direction: column;
}
.scan-mask-top { flex: 1; background: rgba(0,0,0,0.55); }
.scan-mask-mid { display: flex; }
.scan-mask-side { flex: 1; background: rgba(0,0,0,0.55); }
.scan-window {
  width: 220px;
  height: 220px;
  position: relative;
}
.scan-corner {
  position: absolute;
  width: 26px; height: 26px;
  border: 3px solid var(--accent);
}
.scan-corner.tl { top: 0; left: 0; border-right: 0; border-bottom: 0; }
.scan-corner.tr { top: 0; right: 0; border-left: 0; border-bottom: 0; }
.scan-corner.bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
.scan-corner.br { bottom: 0; right: 0; border-left: 0; border-top: 0; }
.scan-line {
  position: absolute;
  top: 0; left: 8px; right: 8px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  box-shadow: 0 0 8px var(--accent);
  animation: scan-sweep 1.6s ease-in-out infinite alternate;
}
@keyframes scan-sweep {
  from { transform: translateY(8px); }
  to { transform: translateY(208px); }
}
.scan-mask-bottom { flex: 1.4; background: rgba(0,0,0,0.55); padding: 16px 18px 24px; color: #f3eee2; display: flex; flex-direction: column; gap: 10px; }
.scan-hint {
  font-size: 11.5px;
  text-align: center;
  color: rgba(243, 238, 226, 0.7);
}
.scan-titlebar {
  position: absolute;
  top: 38px; left: 0; right: 0;
  padding: 6px 18px 10px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 6;
  color: #f3eee2;
  font-size: 13px;
  font-weight: 600;
}
.scan-titlebar .iconbtn {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  display: grid; place-items: center;
  border: 0;
  color: inherit;
}

.scan-card {
  background: rgba(20,16,8,0.92);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.scan-card .pill { border-radius: 4px; }
.scan-card-row {
  display: flex; justify-content: space-between;
  font-size: 11.5px;
}
.scan-card-row .k { color: rgba(243,238,226,0.55); }
.scan-card-row .v { color: #f3eee2; font-weight: 500; }

.scan-fab {
  width: 100%;
  height: 44px;
  border-radius: 10px;
  border: 0;
  background: var(--accent);
  color: #fff;
  font-weight: 600;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}

/* Side panel with log */
.scan-log {
  height: 660px;
  background: var(--bg-2);
  border: 1px solid var(--line-1);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.scan-log-head {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-1);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.scan-log-body {
  flex: 1;
  overflow-y: auto;
}
.scan-log-row {
  display: grid;
  grid-template-columns: 60px 1fr auto;
  gap: 10px;
  padding: 9px 14px;
  border-bottom: 1px solid var(--line-2);
  font-size: 11.5px;
  align-items: center;
}
.scan-log-row .ts { font-family: var(--mono-font); font-size: 10.5px; color: var(--fg-2); }
.scan-log-row .label { font-size: 11px; }
.scan-log-row .meta { font-family: var(--mono-font); font-size: 10px; color: var(--fg-2); }

/* =========================================================================
   QR display (svg)
   ========================================================================= */
.qr-svg { display: block; }
.qr-svg rect.bg { fill: #ffffff; }
.qr-svg rect.cell { fill: #14110b; }
[data-theme="dark"] .qr-svg rect.bg,
[data-theme="industrial"] .qr-svg rect.bg { fill: #f3eee2; }

/* =========================================================================
   Order builder
   ========================================================================= */
.builder {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: var(--density-section-gap);
  align-items: start;
}
.builder-summary {
  position: sticky;
  top: 0;
}
.empty-state {
  padding: 24px 16px;
  text-align: center;
  color: var(--fg-2);
  font-size: var(--density-fs-2);
  background: var(--bg-3);
  border: 1px dashed var(--line-strong);
  border-radius: 6px;
}
.order-line {
  display: grid;
  grid-template-columns: 1fr 90px 80px 28px;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line-2);
}
.order-line:last-child { border-bottom: 0; }
.order-line-name { font-weight: 500; }
.order-line-meta { font-size: 10.5px; color: var(--fg-2); margin-top: 1px; }
.qty-stepper {
  display: flex; align-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  overflow: hidden;
  background: var(--bg-2);
  height: 26px;
}
.qty-stepper button {
  width: 24px; height: 100%;
  border: 0;
  background: transparent;
  cursor: pointer;
  color: var(--fg-1);
}
.qty-stepper button:hover { background: var(--bg-hover); }
.qty-stepper input {
  width: 40px; height: 100%;
  border: 0; background: transparent;
  text-align: center;
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  color: var(--fg-0);
  font-family: inherit;
  outline: none;
  border-left: 1px solid var(--line-1);
  border-right: 1px solid var(--line-1);
}

.ops-tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 4px;
}
.ops-tag {
  font-family: var(--mono-font);
  font-size: 9.5px;
  padding: 1px 5px;
  background: var(--bg-3);
  color: var(--fg-1);
  border-radius: 2px;
  letter-spacing: 0.02em;
}

.icon-btn {
  width: 26px; height: 26px;
  border: 0; background: transparent;
  border-radius: 4px;
  cursor: pointer;
  color: var(--fg-2);
  display: grid; place-items: center;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--fg-0); }

/* =========================================================================
   Library
   ========================================================================= */
.lib-grid {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: var(--density-section-gap);
  align-items: start;
}
.lib-list {
  background: var(--bg-2);
  border: 1px solid var(--line-1);
  border-radius: 8px;
  box-shadow: var(--shadow-1);
  overflow: hidden;
}
.lib-search {
  padding: 10px;
  border-bottom: 1px solid var(--line-1);
}
.lib-search input { width: 100%; }
.lib-item {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line-2);
  cursor: pointer;
}
[data-density="airy"] .lib-item { padding: 14px 18px; }
.lib-item:hover { background: var(--bg-hover); }
.lib-item.active { background: var(--accent-soft); }
.lib-item .code {
  font-family: var(--mono-font);
  font-size: 10.5px;
  color: var(--fg-2);
}
.lib-item .name {
  font-size: var(--density-fs-1);
  font-weight: 500;
  margin: 2px 0 4px;
}
.lib-item .meta {
  font-size: 10.5px;
  color: var(--fg-2);
  display: flex; gap: 8px;
}
.lib-item .meta span { display: flex; align-items: center; gap: 3px; }
.lib-item.active .code,
.lib-item.active .meta { color: var(--accent); }

.lib-detail {
  background: var(--bg-2);
  border: 1px solid var(--line-1);
  border-radius: 8px;
  box-shadow: var(--shadow-1);
  overflow: hidden;
}
.lib-detail-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line-1);
  background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
}
[data-density="airy"] .lib-detail-head { padding: 22px 26px; }
.lib-detail-code {
  font-family: var(--mono-font);
  font-size: 10.5px;
  color: var(--accent);
  font-weight: 600;
  letter-spacing: 0.04em;
}
.lib-detail-name {
  font-size: 20px;
  font-weight: 600;
  margin-top: 4px;
  letter-spacing: -0.01em;
}
[data-density="airy"] .lib-detail-name { font-size: 24px; }
.lib-detail-desc {
  font-size: var(--density-fs-2);
  color: var(--fg-1);
  margin-top: 4px;
}

.lib-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-bottom: 1px solid var(--line-1);
}
.lib-stat {
  padding: 12px 16px;
  border-right: 1px solid var(--line-1);
}
.lib-stat:last-child { border-right: 0; }
.lib-stat-label {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-2);
}
.lib-stat-value {
  font-size: 17px;
  font-weight: 600;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.lib-stat-value .unit { font-size: 11px; color: var(--fg-2); margin-left: 3px; }

/* =========================================================================
   Modal
   ========================================================================= */
.modal-back {
  position: fixed;
  inset: 0;
  background: rgba(20, 16, 8, 0.55);
  display: grid;
  place-items: center;
  z-index: 1000;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--bg-2);
  border: 1px solid var(--line-1);
  border-radius: 10px;
  box-shadow: var(--shadow-pop);
  width: min(720px, 92vw);
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-1);
}
.modal-body {
  padding: 18px;
  overflow-y: auto;
}
.modal-foot {
  padding: 12px 18px;
  border-top: 1px solid var(--line-1);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--bg-1);
}
.modal-title { font-size: 16px; font-weight: 600; margin: 0; }

/* =========================================================================
   Print
   ========================================================================= */
@media print {
  body, .app { background: #fff; }
  .sidebar, .topbar, .tweaks, .btn, .scan-log, .scanner-stage > div:not(.routesheet) { display: none !important; }
  .scroller { padding: 0; overflow: visible; }
  .routesheet { box-shadow: none; border: 0; padding: 0; }
}

/* =========================================================================
   Misc
   ========================================================================= */
.sep-v { width: 1px; height: 18px; background: var(--line-1); }
.muted { color: var(--fg-2); }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 6px;
  background: var(--bg-3);
  color: var(--fg-1);
  font-size: 10.5px;
  border-radius: 3px;
  font-family: var(--mono-font);
}

.alert {
  display: flex;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 6px;
  background: var(--st-prog-bg);
  border: 1px solid var(--st-prog-line);
  color: var(--st-prog-fg);
  font-size: var(--density-fs-2);
}
.alert.warn { background: var(--st-warn-bg); border-color: var(--st-warn-line); color: var(--st-warn-fg); }
.alert.block { background: var(--st-block-bg); border-color: var(--st-block-line); color: var(--st-block-fg); }

.toast-stack {
  position: fixed;
  right: 18px;
  top: 60px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 900;
}
.toast {
  background: var(--bg-2);
  border: 1px solid var(--st-prog-line);
  border-left: 3px solid var(--st-prog-line);
  padding: 10px 14px;
  border-radius: 6px;
  box-shadow: var(--shadow-pop);
  font-size: var(--density-fs-2);
  min-width: 280px;
  animation: toast-in 0.2s ease;
}
@keyframes toast-in {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Progress bar within task row */
.task-row {
  display: grid;
  grid-template-columns: 36px 1fr 110px 70px 110px 120px;
  align-items: center;
  gap: 12px;
  padding: 9px 14px;
  border-bottom: 1px solid var(--line-2);
  font-size: var(--density-fs-2);
}
[data-density="airy"] .task-row { padding: 14px 18px; }
.task-row:last-child { border-bottom: 0; }
.task-row:hover { background: var(--bg-hover); }
.task-row.done { opacity: 0.6; }
.op-num {
  font-family: var(--mono-font);
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  text-align: center;
  letter-spacing: 0.04em;
}
.task-name { font-weight: 500; }
.task-meta { font-size: 10.5px; color: var(--fg-2); margin-top: 1px; }
.qty-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  font-variant-numeric: tabular-nums;
  font-size: 11px;
}
.qty-bar .bar {
  flex: 1;
  height: 4px;
  background: var(--bg-3);
  border-radius: 99px;
  overflow: hidden;
}
.qty-bar .fill {
  height: 100%;
  background: var(--st-prog-line);
}
.task-row .actions {
  display: flex; justify-content: flex-end; gap: 4px;
}

.subhead {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-2);
  margin: 18px 0 6px;
}

/* =========================================================================
   Адаптивный дизайн — мобильные устройства
   ========================================================================= */

/* Планшет / небольшой экран */
/* Планшет */
@media (max-width: 1024px) {
  .grid-4 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .builder { grid-template-columns: 1fr; }
  .lib-grid { grid-template-columns: 1fr; }
  .scanner-stage { grid-template-columns: 1fr; }
}

/* ═══════════════════════════════════════════
   МОБИЛЬНЫЙ (≤768px)
   ═══════════════════════════════════════════ */
@media (max-width: 768px) {

  /* Сайдбар — скрыть, показать нижнюю навигацию */
  .sidebar { display: none !important; }
  .app { grid-template-columns: 1fr !important; }
  .main { min-width: 0; }

  /* Нижняя навигация */
  .mobile-nav {
    display: flex !important;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: var(--bg-1);
    border-top: 1px solid var(--line-2);
    z-index: 100;
    justify-content: space-around;
    align-items: center;
    padding: 0 4px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .mobile-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 4px 8px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--fg-2);
    font-size: 10px;
    font-family: var(--ui-font);
    cursor: pointer;
    transition: color .15s, background .15s;
    min-width: 52px;
    min-height: 48px;
    position: relative;
  }
  .mobile-nav-item.active {
    color: var(--accent);
  }
  .mobile-nav-item .badge {
    position: absolute;
    top: 2px; right: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 9px;
    border-radius: 99px;
    padding: 0 4px;
    min-width: 14px;
    text-align: center;
    line-height: 14px;
  }

  /* Скролл */
  .scroller {
    padding: 12px 14px calc(72px + env(safe-area-inset-bottom, 0px)) !important;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
  }

  /* Топбар */
  .topbar {
    height: 52px !important;
    padding: 0 12px !important;
  }
  .topbar .crumbs { display: none; }
  .topbar-title {
    display: block !important;
    font-size: 16px !important;
    font-weight: 600;
    color: var(--fg-0);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-actions { gap: 4px !important; }
  .topbar-actions .btn { padding: 0 10px !important; }

  /* Страница */
  .page-head {
    padding: 12px 0 10px !important;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>

                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>

          {children}

            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />

          )}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  <script type="text/babel" data-presets="react">
// qr.jsx — QR generation (uses qrcode-generator from CDN, exposed as window.qrcode)

function generateQrSvg(text, size, quietZone = 2) {
  if (!window.qrcode) return null;
  try {
    const qr = window.qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    const count = qr.getModuleCount();
    const total = count + quietZone * 2;
    const cellSize = size / total;
    const cells = [];
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) {
          cells.push({
            x: (c + quietZone) * cellSize,
            y: (r + quietZone) * cellSize,
            w: cellSize,
            h: cellSize,
          });
        }
      }
    }
    return { size, cells, total, cellSize };
  } catch (e) {
    return null;
  }
}

const QrCode = React.memo(function QrCode({ text, size = 90, className, style }) {
  const data = React.useMemo(() => generateQrSvg(text, size), [text, size]);
  if (!data) {
    return (
      <div style={{ width: size, height: size, border: '1px solid #ccc', display: 'grid', placeItems: 'center', fontSize: 9, color: '#999', ...style }}>
        QR…
      </div>
    );
  }
  return (
    <svg
      className={'qr-svg ' + (className || '')}
      width={size} height={size}
      viewBox={`0 0 ${size} ${size}`}
      style={style}
      shapeRendering="crispEdges"
    >
      <rect className="bg" x="0" y="0" width={size} height={size} />
      {data.cells.map((c, i) => (
        <rect className="cell" key={i} x={c.x} y={c.y} width={c.w} height={c.h} />
      ))}
    </svg>
  );
});

window.QrCode = QrCode;
window.generateQrSvg = generateQrSvg;

// Build operation_tasks from orders × items × operations.
// Pre-seeds plausible progress so the dashboard isn't empty.
function buildTasks(orders, details) {
  const tasks = [];
  for (const order of orders) {
    for (const item of order.items) {
      const det = details.find(d => d.id === item.detailId);
      if (!det) continue;
      det.operations.forEach((op, idx) => {
        // Demo seeding logic: first few ops done, then progress, then waiting
        let completed = 0;
        let status = 'waiting';
        let updatedAt = null;
        let operator = null;
        const ratio = idx / (det.operations||[]).length;
        if (ratio < 0.3) {
          completed = item.quantity;
          status = 'done';
          updatedAt = `2026-05-${15 + Math.min(idx, 4)} ${10 + idx}:${idx < 5 ? '04' : '32'}`;
          operator = pickOperator(det.id, idx);
        } else if (ratio < 0.45) {
          completed = Math.max(1, Math.floor(item.quantity * 0.6));
          status = 'in_progress';
          updatedAt = `2026-05-19 14:${20 + idx}`;
          operator = pickOperator(det.id, idx);
        }
        tasks.push({
          id: `OT-${order.id.slice(2)}-${det.id.slice(2)}-${op.num}`,
          orderId: order.id,
          detailId: det.id,
          opNum: op.num,
          opName: op.name,
          workCenter: op.workCenter,
          time: op.time,
          planned: item.quantity,
          completed,
          status,
          qrText: `OTASK:${order.id.slice(2)}-${det.id.slice(2)}-${op.num}`,
          updatedAt,
          operator,
        });
      });
    }
  }
  return tasks;
}

const OPERATORS_RU = ['Семёнов И.Н.', 'Гаврилов А.Б.', 'Маркина Е.В.', 'Орлов Д.С.', 'Петрова Н.А.', 'Юсупов Р.Ш.'];
const OPERATORS_EN = ['I. Semyonov', 'A. Gavrilov', 'E. Markina', 'D. Orlov', 'N. Petrova', 'R. Yusupov'];
function pickOperator(seed, idx) {
  const ops = window.__APP_LANG === 'en' ? OPERATORS_EN : OPERATORS_RU;
  const hash = (seed.charCodeAt(2) + idx * 7) % ops.length;
  return ops[hash];
}

// Pre-built sample scan log entries (for showing what audit looks like)
function buildScanLog(tasks) {
  const log = [];
  const doneTasks = tasks.filter(t => t.status === 'done').slice(0, 6);
  doneTasks.forEach((t, i) => {
    log.push({
      ts: t.updatedAt || `2026-05-1${5 + i} 09:${10 + i * 7}`,
      taskId: t.id,
      qr: t.qrText,
      detail: t.detailId,
      op: `${t.opNum} ${t.opName}`,
      operator: t.operator,
      result: 'closed',
      quantity: t.planned,
    });
  });
  return log.reverse();
}

                {lang === 'en' ? 'No orders found' : 'Заказы не найдены'}
              </div>
            ) : filtered.map(o => (
              <div key={o.id} onClick={() => { onSelect(o.id); setOpen(false); }}
                style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 14px',
                  cursor:'pointer', borderBottom:'1px solid var(--line-2)',
                  background: o.id === activeId ? 'var(--bg-hover)' : 'transparent',
                  transition:'background .1s' }}
                onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                onMouseLeave={e => e.currentTarget.style.background = o.id === activeId ? 'var(--bg-hover)' : 'transparent'}>
                {/* Цветная метка статуса */}
                <div style={{ width:3, height:36, borderRadius:2, flexShrink:0,
                  background: o.status==='done' ? 'var(--st-done-line)' :
                               o.status==='in_work' ? 'var(--st-prog-line)' : 'var(--st-wait-line)' }}/>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <span className="mono" style={{ fontWeight:700, color:'var(--accent)', fontSize:13 }}>
                      {o.number}
                    </span>
                    {o.id === activeId && (
                      <span style={{ fontSize:10, color:'var(--accent)', fontWeight:600 }}>← активный</span>
                    )}
                  </div>
                  <div style={{ fontSize:12, color:'var(--fg-1)', marginTop:1,
                    overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                    {o.customer}
                    {o.foreman && <span style={{ color:'var(--fg-2)' }}> · {o.foreman}</span>}
                  </div>
                </div>
                <div style={{ textAlign:'right', flexShrink:0 }}>
                  <div style={{ fontSize:11, color: PRIORITY_COLOR[o.priority] || 'var(--fg-2)' }}>
                    {PRIORITY_LBL[o.priority] || ''}
                  </div>
                  <div style={{ fontSize:11, color:'var(--fg-2)', marginTop:2 }}>
                    {o.dueDate || o.due_date}
                  </div>
                </div>
                <span className={'pill ' + STATUS_CLS[o.status]} style={{ fontSize:10, flexShrink:0 }}>
                  <span className="dot"/>{STATUS_LBL[o.status]}
                </span>
              </div>
            ))}
          </div>

          {/* Футер */}
          <div style={{ padding:'8px 14px', borderTop:'1px solid var(--line-2)',
            display:'flex', justifyContent:'space-between', fontSize:11, color:'var(--fg-2)' }}>
            <span>{filtered.length} из {orders.length} заказов</span>
            <span>{inWork} в работе · {inPlan} планируется</span>
          </div>
        </div>
      )}
    </div>
  );
}

function Dashboard({ data, tasks, scanLog, lang, onScan, onCloseTask, onNewOrder }) {
  const S = useStrings(lang);
  const [activeId, setActiveId] = React.useState(data.orders[0]?.id);

  // Re-sync если заказы обновились
  React.useEffect(() => {
    if (!data.orders.find(o => o.id === activeId) && data.orders.length) {
      setActiveId(data.orders[0].id);
    }
  }, [data.orders]);

  const order = data.orders.find(o => o.id === activeId) || data.orders[0];
  if (!order) return (
    <div style={{ padding:24, textAlign:'center', color:'var(--fg-2)' }}>
      <p style={{ marginBottom:16 }}>{lang === 'en' ? 'No orders yet' : 'Нет заказов'}</p>
      <button className="btn primary" onClick={onNewOrder}><Icon name="plus" size={14}/>{lang === 'en' ? 'New order' : 'Создать заказ'}</button>
    </div>
  );

  const items = order.items.map(it => {
    const det = data.details.find(d => d.id === it.detailId);
    const itemTasks = tasks.filter(t => t.orderId === order.id && t.detailId === it.detailId);
    const done = itemTasks.filter(t => t.status === 'done').length;
    return { ...it, det, tasks: itemTasks, done, total: itemTasks.length };
  });

  const allTasks = tasks.filter(t => t.orderId === order.id);
  const inProg  = allTasks.filter(t => t.status === 'in_progress').length;
  const doneCt  = allTasks.filter(t => t.status === 'done').length;
  const waitCt  = allTasks.filter(t => t.status === 'waiting').length;
  const overdue = allTasks.filter(t => t.status === 'waiting' && t.opNum <= 40).length;
  const totalTime = allTasks.reduce((s, t) => s + t.time * t.planned, 0);
  const doneTime  = allTasks.filter(t => t.status === 'done').reduce((s, t) => s + t.time * t.planned, 0);
  const pct = totalTime > 0 ? Math.round((doneTime / totalTime) * 100) : 0;

  const STATUS_CLS = { plan:'wait', in_work:'prog', done:'done' };
  const STATUS_LBL = { plan:'Планируется', in_work:'В работе', done:'Выполнен' };

  return (
    <>
      <div className="page-head">
        <div>
          <h1 className="page-title">{S.navDash}</h1>
          <div className="page-sub">{S.workspace} · {S.shift}</div>
        </div>
        <div className="row">
          <button className="btn" onClick={onScan}><Icon name="qr" size={14}/>{S.scanQR}</button>
          <button className="btn primary" onClick={onNewOrder}><Icon name="plus" size={14}/>{S.newOrder}</button>
        </div>
      </div>

      {/* Список заказов — умный пикер */}
      <OrderPicker orders={data.orders} activeId={activeId}
        onSelect={setActiveId} onNew={onNewOrder} lang={lang}/>

      <div className="grid-4" style={{ marginBottom: 'var(--density-section-gap)' }}>
        <div className="kpi accent">
          <div className="kpi-label">{S.active}</div>
          <div className="kpi-value num mono">{order.number}</div>
          <div className="kpi-meta">{order.customer}</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">{S.inWork}</div>
          <div className="kpi-value num">{inProg}<span className="unit">/ {allTasks.length} {S.ops}</span></div>
          <div className="kpi-meta">
            <span className="pill prog" style={{padding:'1px 5px'}}><span className="dot"/>{doneCt}</span>
            <span className="pill wait" style={{padding:'1px 5px'}}><span className="dot"/>{waitCt}</span>
            <span>· {Math.round(doneTime/60)}{S.hr} / {Math.round(totalTime/60)}{S.hr}</span>
          </div>
        </div>
        <div className="kpi">
          <div className="kpi-label">{S.doneToday}</div>
          <div className="kpi-value num">{doneCt}<span className="unit">{S.ops}</span></div>
          <div className="kpi-meta"><span>{pct}% {lang === 'en' ? 'complete' : 'выполнено'}</span></div>
        </div>
        <div className="kpi">
          <div className="kpi-label">{S.overdue}</div>
          <div className="kpi-value num">{overdue > 0 ? 1 : 0}<span className="unit">{lang === 'en' ? 'part' : 'дет.'}</span></div>
          <div className="kpi-meta"><span className="dn">{lang === 'en' ? 'check op. 60' : 'проверить оп. 60'}</span></div>
        </div>
      </div>

      <div className="grid-2">
        <div>
          <div className="subhead" style={{ marginTop: 0 }}>
            {lang === 'en' ? 'Production board' : 'Производственное табло'} · {order.number}
          </div>
          {items.length === 0
            ? <div className="empty-state">{lang === 'en' ? 'No parts in order' : 'Нет деталей в заказе'}</div>
            : items.map(it => (
              <DetailBoardGroup key={it.detailId} detail={it.det} tasks={it.tasks}
                done={it.done} total={it.total} qty={it.quantity} lang={lang} onCloseTask={onCloseTask}/>
            ))
          }
        </div>

        <div>
          <div className="subhead" style={{ marginTop: 0 }}>{S.recentScans}</div>
          <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
            {scanLog.length === 0 && <div className="empty-state" style={{ borderRadius:0,border:0 }}>—</div>}
            {scanLog.slice(0, 7).map((s, i) => (
              <div key={i} className="scan-log-row">
                <div className="ts">{s.ts.slice(-5)}</div>
                <div>
                  <div className="label">
                    <span className="mono" style={{ color:'var(--accent)' }}>{('0'+(s.op?.split(' ')[0]||'')).slice(-3)} </span>
                    {s.op?.split(' ').slice(1).join(' ')}
                  </div>
                  <div className="meta">{s.detail} · {s.operator}</div>
                </div>
                <span className="pill done"><Icon name="check" size={11}/></span>
              </div>
            ))}
          </div>

          <div className="subhead">{lang === 'en' ? 'Order timing' : 'Прогресс по времени'}</div>
          <div className="card">
            <div className="row" style={{ justifyContent:'space-between', marginBottom:8 }}>
              <span className="muted" style={{ fontSize:11 }}>{S.created} {order.createdAt} · {S.dueDate} {order.dueDate}</span>
              <span className="mono num" style={{ fontSize:11, color:'var(--accent)' }}>{pct}%</span>
            </div>
            <div className="board-progress" style={{ maxWidth:'none', height:8 }}>
              <div className="board-progress-fill" style={{ width: pct + '%' }}/>
            </div>
            <div className="row" style={{ marginTop:10, justifyContent:'space-between', fontSize:11 }}>
              <span className="muted">{lang === 'en' ? 'Spent' : 'Затрачено'}: <b className="num">{Math.round(doneTime/60)}{S.hr} {doneTime%60}{S.min}</b></span>
              <span className="muted">{lang === 'en' ? 'Remaining' : 'Осталось'}: <b className="num">{Math.round((totalTime-doneTime)/60)}{S.hr}</b></span>
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

    <div className="board-group">
      <div className="board-grp-head">
        <Icon name="box" size={16} className="muted" />
        <div>
          <div className="board-grp-title">{detail.name}</div>

  );
}

function Library({ data, tasks, lang, onNewDetail, onEditDetail, onDeleteDetail }) {

  const [query, setQuery] = React.useState('');

  const filtered = data.details.filter(d =>
    d.name.toLowerCase().includes(query.toLowerCase()) ||
    d.code.toLowerCase().includes(query.toLowerCase())
  );

  // Если выбранная деталь удалена — переключаемся на первую доступную
  const detail = data.details.find(d => d.id === selectedId) || data.details[0] || null;

  React.useEffect(() => {
    if (!data.details.find(d => d.id === selectedId) && data.details.length > 0) {

              <input
                className="input"

                value={query}
                onChange={e => setQuery(e.target.value)}
                style={{ width: '100%', paddingLeft: 28 }}

          {filtered.map(d => (

        </div>

}

function OrderBuilder({ data, tasks, lang, onPrint, onSave, onDeleteOrder, onSelectOrder, activeOrderId }) {
  const S = useStrings(lang);
  const order = data.orders[0];

  if (!order) return (
    <div style={{ padding:48, textAlign:'center', color:'var(--fg-2)' }}>
      <p style={{ marginBottom:16 }}>Нет активных заказов</p>
    </div>
  );

  const [items, setItems] = React.useState(() => order.items.map(it => ({ ...it })));
  const [number] = React.useState(order.number);
  const [customer, setCustomer] = React.useState(order.customer);
  const [dueDate, setDueDate] = React.useState(order.dueDate);
  const [foreman, setForeman] = React.useState(order.foreman);
  const [adding, setAdding] = React.useState(false);

  const updateQty = (idx, v) => {
    const next = [...items];
    next[idx] = { ...next[idx], quantity: Math.max(1, v) };
    setItems(next);
  };
  const removeLine = (idx) => setItems(items.filter((_, i) => i !== idx));
  const addLine = (detailId) => {
    if (items.find(i => i.detailId === detailId)) return setAdding(false);
    setItems([...items, { detailId, quantity: 1 }]);
    setAdding(false);
  };

  // Computed: total ops, total time
  const totalOps = items.reduce((s, it) => {
    const det = data.details.find(d => d.id === it.detailId);
    return s + (det ? (det.operations||[]).length : 0);
  }, 0);
  const totalTime = items.reduce((s, it) => {
    const det = data.details.find(d => d.id === it.detailId);
    if (!det) return s;
    return s + (det.operations||[]).reduce((ss, o) => ss + o.time, 0) * it.quantity;
  }, 0);
  const totalUnits = items.reduce((s, it) => s + it.quantity, 0);

  return (
    <>
      <div className="page-head">
        <div>
          <h1 className="page-title">{lang === 'en' ? 'Order' : 'Заказ'} {number}</h1>
          <div className="page-sub">
            {S.created} {order.createdAt} · <span className="pill prog" style={{padding:'1px 6px'}}><span className="dot"/>{lang === 'en' ? 'In progress' : 'В работе'}</span>
          </div>
        </div>
        <div className="row">
          <button className="btn" onClick={() => onSelectOrder && onSelectOrder(order)}><Icon name="edit" size={14} />{lang === 'en' ? 'Edit' : 'Редактировать'}</button>
          <button className="btn" style={{ color:'var(--danger)' }} onClick={() => onDeleteOrder && onDeleteOrder(order)}><Icon name="trash" size={14} />{lang === 'en' ? 'Delete' : 'Удалить'}</button>
          <button className="btn" onClick={onSave}><Icon name="check" size={14} />{S.saveOrder}</button>
          <button className="btn primary" onClick={onPrint}><Icon name="print" size={14} />{S.generateSheet}</button>
        </div>
      </div>

      <div className="builder">
        <div className="stack">
          <div className="card">
            <div className="card-head">
              <h3 className="card-title">{lang === 'en' ? 'Order header' : 'Параметры заказа'}</h3>
              <span className="muted" style={{ fontSize: 11 }}>{lang === 'en' ? 'Editable until generated' : 'Можно править до выпуска'}</span>
            </div>
            <div className="grid-3">
              <div className="field">
                <span className="field-label">{S.customer}</span>
                <input className="input" value={customer} onChange={e => setCustomer(e.target.value)} />
              </div>
              <div className="field">
                <span className="field-label">{S.dueDate}</span>
                <input className="input" value={dueDate} onChange={e => setDueDate(e.target.value)} />
              </div>
              <div className="field">
                <span className="field-label">{S.foreman}</span>
                <input className="input" value={foreman} onChange={e => setForeman(e.target.value)} />
              </div>
            </div>
          </div>

          <div className="card" style={{ padding: 0 }}>
            <div className="toolbar">
              <Icon name="orders" size={14} className="muted" />
              <b style={{ fontSize: 13 }}>{S.orderComp}</b>
              <span className="tag mono">{items.length} {lang === 'en' ? 'lines' : 'строк'}</span>
              <span className="topbar-spacer" />
              <button className="btn ghost" onClick={() => setAdding(!adding)}>
                <Icon name="plus" size={14} />{S.addLine}
              </button>
            </div>

            {adding && (
              <div style={{ padding: '10px 14px', borderBottom: '1px solid var(--line-2)', background: 'var(--bg-1)' }}>
                <select className="select" autoFocus
                  defaultValue=""
                  onChange={e => e.target.value && addLine(e.target.value)}
                  style={{ width: '100%' }}>
                  <option value="" disabled>{lang === 'en' ? 'Pick a part…' : 'Выбрать деталь…'}</option>
                  {data.details
                    .filter(d => !items.find(i => i.detailId === d.id))
                    .map(d => (
                      <option key={d.id} value={d.id}>{d.code} — {d.name}</option>
                    ))}
                </select>
              </div>
            )}

            {items.length === 0 && (
              <div style={{ padding: 20 }}>
                <div className="empty-state">{lang === 'en' ? 'No parts added yet' : 'Детали не добавлены'}</div>
              </div>
            )}

            {items.map((it, idx) => {
              const det = data.details.find(d => d.id === it.detailId);
