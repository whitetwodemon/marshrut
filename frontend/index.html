              return (
                <div key={it.detailId} className="order-line">
                  <div>
                    <div className="order-line-name">{det.name}</div>
                    <div className="order-line-meta">
                      <span className="mono" style={{ color: 'var(--accent)' }}>{det.code}</span>
                      <span className="muted" style={{ marginLeft: 10 }}>{det.material}</span>
                    </div>
                    <div className="ops-tag-list">
                      {(det.operations||[]).slice(0, 6).map(op => (
                        <span key={op.num} className="ops-tag">{String(op.num).padStart(2,'0')} {op.name.slice(0, 14)}</span>
                      ))}
                      {(det.operations||[]).length > 6 && <span className="ops-tag">+{(det.operations||[]).length - 6}</span>}
                    </div>
                  </div>
                  <div className="qty-stepper">
                    <button onClick={() => updateQty(idx, it.quantity - 1)}>−</button>
                    <input value={it.quantity} onChange={e => updateQty(idx, parseInt(e.target.value) || 1)} className="num" />
                    <button onClick={() => updateQty(idx, it.quantity + 1)}>+</button>
                  </div>
                  <div style={{ textAlign: 'right', fontSize: 11 }}>
                    <div className="num"><b>{(det.operations||[]).length * it.quantity}</b> <span className="muted">{S.ops}</span></div>
                    <div className="muted num">{(det.operations||[]).reduce((s, o) => s + o.time, 0) * it.quantity}{S.min}</div>
                  </div>
                  <button className="icon-btn" onClick={() => removeLine(idx)} title={lang === 'en' ? 'Remove' : 'Удалить'}>
                    <Icon name="trash" size={14} />
                  </button>
                </div>
              );
            })}
          </div>
        </div>

        <div className="builder-summary stack">
          <div className="card">
            <div className="card-head">
              <h3 className="card-title">{S.summary}</h3>
              <span className="muted mono" style={{ fontSize: 11 }}>{number}</span>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
              <div>
                <div className="kpi-label">{S.detailsCt}</div>
                <div className="kpi-value num" style={{ fontSize: 22 }}>{items.length}</div>
              </div>
              <div>
                <div className="kpi-label">{S.partsCt}</div>
                <div className="kpi-value num" style={{ fontSize: 22 }}>{totalUnits}<span className="unit">{S.pcs}</span></div>
              </div>
              <div>
                <div className="kpi-label">{S.totalOps}</div>
                <div className="kpi-value num" style={{ fontSize: 22 }}>{items.reduce((s, it) => {
                  const det = data.details.find(d => d.id === it.detailId);
                  return s + (det ? (det.operations||[]).length * it.quantity : 0);
                }, 0)}</div>
              </div>
              <div>
                <div className="kpi-label">{S.totalTime}</div>
                <div className="kpi-value num" style={{ fontSize: 22 }}>{Math.round(totalTime / 60)}<span className="unit">{S.hr} {totalTime % 60}{S.min}</span></div>
              </div>
            </div>
            <div style={{ height: 1, background: 'var(--line-1)', margin: '14px 0' }} />
            <div style={{ fontSize: 11.5, color: 'var(--fg-1)', lineHeight: 1.5 }}>
              {lang === 'en'
                ? 'Generating the route sheet will create operation tasks for every part-operation pair and a unique QR code per task.'
                : 'При выпуске будут созданы задания на каждую пару «деталь × операция» и уникальный QR-код для каждого.'}
            </div>
            <button className="btn primary" style={{ width: '100%', justifyContent: 'center', marginTop: 12, height: 36 }} onClick={onPrint}>
              <Icon name="print" size={14} />{S.generateSheet}
            </button>
          </div>

          <div className="card">
            <div className="card-head">
              <h3 className="card-title" style={{ fontSize: 12 }}>{lang === 'en' ? 'Workload preview' : 'Загрузка рабочих центров'}</h3>
            </div>
            <WorkCenterPreview items={items} data={data} lang={lang} />
          </div>
        </div>
      </div>
    </>
  );
}

function WorkCenterPreview({ items, data, lang }) {
  const wcMap = {};
  items.forEach(it => {
    const det = data.details.find(d => d.id === it.detailId);
    if (!det) return;
    det.operations.forEach(o => {
      const key = o.workCenter;
      wcMap[key] = (wcMap[key] || 0) + o.time * it.quantity;
    });
  });
  const entries = Object.entries(wcMap).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...entries.map(e => e[1]));
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, fontSize: 11 }}>
      {entries.map(([wc, mins]) => (
        <div key={wc}>
          <div className="row" style={{ justifyContent: 'space-between', marginBottom: 2 }}>
            <span className="mono" style={{ fontSize: 10.5 }}>{wc}</span>
            <span className="num muted">{mins}{lang === 'en' ? 'm' : 'м'}</span>
          </div>
          <div style={{ height: 4, background: 'var(--bg-3)', borderRadius: 99, overflow: 'hidden' }}>
            <div style={{ height: '100%', width: (mins / max * 100) + '%', background: 'var(--accent)' }} />
          </div>
        </div>
      ))}
    </div>
  );
}

          <td style="font-family:monospace;font-weight:700;padding:6px 8px;border-bottom:1px solid #e5dec8">${String(t.opNum).padStart(3,'0')}</td>
          <td style="padding:6px 8px;border-bottom:1px solid #e5dec8"><b>${t.opName}</b></td>

          <td style="border-bottom:1px solid #e5dec8;border-left:1px dashed #b0a994;width:100px"></td>

        <div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #14110b;padding-bottom:6px;margin-bottom:8px">
          <div style="font-size:14pt;font-weight:700">${idx+1}. ${it.det.name}</div>
          <div style="font-size:9pt;color:#5a5240;font-family:monospace">${it.det.code} · Кол-во: <b>${it.quantity}</b> ${it.det.unit} · ${it.det.drawing||''}</div>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:10pt">
          <thead><tr style="background:#f7f1e0">
            <th style="text-align:left;padding:5px 8px;font-size:8pt;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #b0a994;width:38px">№</th>
            <th style="text-align:left;padding:5px 8px;font-size:8pt;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #b0a994">Операция</th>
            <th style="text-align:left;padding:5px 8px;font-size:8pt;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #b0a994;width:130px">Раб. центр</th>
            <th style="text-align:left;padding:5px 8px;font-size:8pt;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #b0a994;width:45px">Кол.</th>
            <th style="text-align:left;padding:5px 8px;font-size:8pt;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #b0a994;width:80px">QR</th>
            <th style="text-align:left;padding:5px 8px;font-size:8pt;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #b0a994;width:100px">Подпись</th>
          </tr></thead>
          <tbody>${opsRows}</tbody>
        </table>
      </div>`;
    }).join('');

    printWin.document.write(`<!DOCTYPE html><html><head>
      <meta charset="utf-8">
      <title>Маршрутный лист ${order.number}</title>
      <style>
        @page { size: A4 portrait; margin: 12mm 15mm; }
        * { -webkit-print-color-adjust: exact; print-color-adjust: exact; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; font-size: 10pt; color: #14110b; background: #fff; margin: 0; }
        @media print { body { margin: 0; } }
      </style>
    </head><body>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #14110b;padding-bottom:12px;margin-bottom:14px">
        <div>
          <div style="font-size:8pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#5a5240">МАРШРУТНЫЙ ЛИСТ</div>
          <div style="font-size:22pt;font-weight:700;margin-top:4px">№ ${order.number}</div>
          <div style="font-size:9pt;color:#5a5240;margin-top:4px">К заказу на производство</div>

        <table style="font-size:9pt;border-collapse:collapse">

          <tr><td style="color:#6e6450;font-weight:500;padding:2px 10px 2px 0">Создан:</td><td style="font-family:monospace">${order.createdAt}</td></tr>

    </body></html>`);
    printWin.document.close();
  }

  // Excel-экспорт маршрутного листа
  function handleExcel() {
    const XLSX = window.XLSX;
    if (!XLSX) { alert('SheetJS не загружен'); return; }

    const wb = XLSX.utils.book_new();

    items.forEach((it, idx) => {
      const rows = [
        ['Маршрутный лист', order.number],
        ['Получатель', order.customer],
        ['Ст. мастер', order.foreman || '—'],
        ['Дата создания', order.createdAt],
        ['Срок', order.dueDate],
        [],
        [`${idx+1}. ${it.det.name}`],
        [`Код: ${it.det.code}  Кол-во: ${it.quantity} ${it.det.unit}  Чертёж: ${it.det.drawing||'—'}`],
        [],
        ['№ оп.', 'Операция', 'Раб. центр', 'Кол-во', 'QR-код', 'Статус', 'Исполнитель', 'Подпись'],
        ...it.tasks.map(t => [
          String(t.opNum).padStart(3,'0'),
          t.opName,
          t.workCenter,
          t.planned,
          t.qrText,
          t.status === 'done' ? 'Выполнена' : t.status === 'in_progress' ? 'В работе' : 'Ожидает',
          t.operator || '',
          '',
        ]),
        [],
      ];

      const ws = XLSX.utils.aoa_to_sheet(rows);

      // Ширина столбцов
      ws['!cols'] = [
        {wch:8},{wch:30},{wch:20},{wch:8},{wch:22},{wch:14},{wch:20},{wch:16}
      ];

      const sheetName = it.det.code.slice(0, 31).replace(/[\\/\?\*\[\]]/g,'_');
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });

    // Сводный лист заказа
    const summaryRows = [
      ['МАРШРУТНЫЙ ЛИСТ — СВОДНЫЙ'],
      ['Заказ', order.number],
      ['Получатель', order.customer],
      ['Ст. мастер', order.foreman || '—'],
      ['Создан', order.createdAt],
      ['Срок', order.dueDate],
      [],
      ['Деталь', 'Код', 'Кол-во', 'Операций', 'Выполнено', 'В работе', 'Ожидает'],
      ...items.map(it => {
        const doneCt  = it.tasks.filter(t=>t.status==='done').length;
        const progCt  = it.tasks.filter(t=>t.status==='in_progress').length;
        const waitCt  = it.tasks.filter(t=>t.status==='waiting').length;
        return [it.det.name, it.det.code, it.quantity, it.tasks.length, doneCt, progCt, waitCt];
      }),
    ];
    const summaryWs = XLSX.utils.aoa_to_sheet(summaryRows);
    summaryWs['!cols'] = [{wch:35},{wch:16},{wch:8},{wch:10},{wch:10},{wch:10},{wch:10}];
    XLSX.utils.book_append_sheet(wb, summaryWs, 'Сводный');

    XLSX.writeFile(wb, `МЛ-${order.number}-${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  return (
    <>
      <div className="page-head">
        <div>
          <h1 className="page-title">{S.routesheet} {order.number}</h1>
          <div className="page-sub">{S.preview} · A4 · QR {qrSize}px</div>
        </div>
        <div className="row">
          <button className="btn ghost" onClick={onClose}><Icon name="arrow-left" size={14}/>{lang === 'en' ? 'Back' : 'К заказу'}</button>
          <button className="btn" onClick={handleExcel}><Icon name="table" size={14}/>Excel</button>
          <button className="btn" onClick={handlePrint}><Icon name="print" size={14}/>{S.printNow}</button>
          <button className="btn primary" onClick={onScanQR}><Icon name="scan" size={14}/>{S.scanQR}</button>
        </div>
      </div>

      {/* Превью маршрутного листа */}
      <div className="print-area" style={{ maxWidth:880, margin:'0 auto' }}>
        <div className="routesheet">
          <div className="rs-head">
            <div>
              <div className="rs-title">{S.sheetTitle}</div>
              <div className="rs-number">№ {order.number}</div>
              <div style={{ fontSize:11, color:'#5a5240', marginTop:4 }}>{S.sheetSubtitle}</div>
            </div>
            <div className="rs-meta">
              <span className="lbl">{S.customer}:</span><span>{order.customer}</span>
              <span className="lbl">{S.foreman}:</span><span>{order.foreman}</span>
              <span className="lbl">{S.created}:</span><span className="mono">{order.createdAt}</span>
              <span className="lbl">{S.dueDate}:</span><span className="mono">{order.dueDate}</span>
              <span className="lbl">{S.page}:</span><span className="mono">1 {S.of} 1</span>
            </div>
          </div>

          {items.map((it, idx) => (
            <React.Fragment key={it.detailId}>
              <div className="rs-detail-head">
                <div className="rs-detail-title">{idx+1}. {it.det.name}</div>
                <div className="rs-detail-meta">{it.det.code} · {S.qtyShort}: <b>{it.quantity}</b> {it.det.unit} · {it.det.drawing}</div>
              </div>
              <table className="rs-ops">
                <thead><tr>
                  <th style={{ width:38 }}>№</th>
                  <th>{S.operation}</th>
                  <th style={{ width:130 }}>{S.workCenter}</th>
                  <th style={{ width:50 }}>{S.qtyShort}</th>
                  <th style={{ width:qrSize+16 }}>{S.qrCode}</th>
                  <th style={{ width:100 }}>{S.signatureCol}</th>
                </tr></thead>
                <tbody>
                  {it.tasks.map(t => (
                    <tr key={t.id}>
                      <td className="mono"><b>{String(t.opNum).padStart(3,'0')}</b></td>
                      <td><b>{t.opName}</b></td>
                      <td className="mono" style={{ fontSize:10 }}>{t.workCenter}</td>
                      <td className="mono num"><b>{t.planned}</b></td>
                      <td className="qr-cell">
                        <QrCode text={t.qrText} size={qrSize}/>
                        <div className="mono" style={{ fontSize:7.5, color:'#7a715b', marginTop:2 }}>{t.qrText}</div>
                      </td>
                      <td className="sign-cell"/>
                    </tr>
                  ))}
                </tbody>
              </table>
            </React.Fragment>
          ))}

          <div className="rs-foot">
            <span>{S.signedBy} ________________________</span>
            <span>{S.date} ____________</span>
            <span className="mono">{order.number} · {new Date().toISOString().slice(0,10)}</span>
          </div>
        </div>
      </div>
    </>
  );
}

          ))}
        </div>
      )}
    </div>
  );
}

// =======================================================
// OrdersListView — все заказы с фильтром, поиском, клик → открыть
// =======================================================
function OrdersListView({ data, tasks, lang, onOpenOrder }) {
  const [query,    setQuery]    = React.useState('');
  const [statusF,  setStatusF]  = React.useState('all');
  const [priorityF,setPriorityF]= React.useState('all');
  const [sortCol,  setSortCol]  = React.useState('created');
  const [sortDir,  setSortDir]  = React.useState('desc');

  const STATUS_LBL  = { plan:'Планируется', in_work:'В работе', done:'Выполнен' };
  const STATUS_CLS  = { plan:'wait', in_work:'prog', done:'done' };
  const PRI_LBL     = { high:'Высокий', normal:'Нормальный', low:'Низкий' };
  const PRI_COL     = { high:'var(--danger)', normal:'var(--fg-1)', low:'var(--fg-2)' };

  const enriched = React.useMemo(() => data.orders.map(o => {
    const ot = tasks.filter(t => t.orderId === o.id);
    const done  = ot.filter(t => t.status === 'done').length;
    const total = ot.length;
    const pct   = total > 0 ? Math.round(done / total * 100) : 0;
    const due   = o.dueDate || o.due_date || '';
    const overdue = due && new Date(due) < new Date() && o.status !== 'done';
    return { ...o, due, done, total, pct, overdue, detailsCt: (o.items||[]).length };
  }), [data.orders, tasks]);

  const filtered = React.useMemo(() => {
    let list = [...enriched];
    const q = query.toLowerCase();
    if (q) list = list.filter(o =>
      o.number.toLowerCase().includes(q) ||
      (o.customer||'').toLowerCase().includes(q) ||
      (o.foreman||'').toLowerCase().includes(q)
    );
    if (statusF !== 'all')   list = list.filter(o => o.status === statusF);
    if (priorityF !== 'all') list = list.filter(o => (o.priority||'normal') === priorityF);

    list.sort((a,b) => {
      let va, vb;
      if (sortCol === 'number')   { va=a.number;   vb=b.number; }
      else if (sortCol==='due')   { va=a.due||'';  vb=b.due||''; }
      else if (sortCol==='pct')   { va=a.pct;      vb=b.pct; }
      else if (sortCol==='status'){ va=a.status;   vb=b.status; }
      else { va=a.createdAt||''; vb=b.createdAt||''; }
      const cmp = typeof va==='number' ? va-vb : (va||'').localeCompare(vb||'');
      return sortDir === 'asc' ? cmp : -cmp;
    });
    return list;
  }, [enriched, query, statusF, priorityF, sortCol, sortDir]);

  function sort(col) {
    if (sortCol === col) setSortDir(d => d==='asc'?'desc':'asc');
    else { setSortCol(col); setSortDir('desc'); }
  }

  function Th({ col, label, cls }) {
    const active = sortCol === col;
    return (
      <th className={cls} style={{ cursor:'pointer', userSelect:'none', whiteSpace:'nowrap' }}
        onClick={() => sort(col)}>
        {label}
        <span style={{ marginLeft:4, opacity: active ? 1 : .3, fontSize:10 }}>
          {active ? (sortDir==='asc' ? '▲' : '▼') : '▲'}
        </span>
      </th>
    );
  }

  const inWork = filtered.filter(o=>o.status==='in_work').length;
  const done   = filtered.filter(o=>o.status==='done').length;
  const overdue= filtered.filter(o=>o.overdue).length;

  return (
    <>
      <div className="page-head">
        <div>
          <h1 className="page-title">Все заказы</h1>
          <div className="page-sub">{filtered.length} заказов · {inWork} в работе · {done} выполнено{overdue>0?` · `+overdue+` просрочено`:''}</div>
        </div>
        <div className="row">
          <button className="btn primary" onClick={() => onOpenOrder('new')}>
            <Icon name="plus" size={14}/>Новый заказ
          </button>
        </div>
      </div>

      {/* Фильтры */}
      <div style={{ display:'flex', gap:8, marginBottom:14, flexWrap:'wrap', alignItems:'center' }}>
        <div style={{ position:'relative', flex:'1', minWidth:200, maxWidth:320 }}>
          <Icon name="search" size={13} style={{ position:'absolute',left:9,top:'50%',transform:'translateY(-50%)',color:'var(--fg-2)' }}/>
          <input className="input" value={query} onChange={e=>setQuery(e.target.value)}
            placeholder="Поиск по номеру, клиенту, мастеру…"
            style={{ paddingLeft:28, fontSize:12 }}/>
        </div>
        <div style={{ display:'flex', gap:4 }}>
          {[['all','Все'], ['in_work','В работе'], ['plan','План'], ['done','Выполнен']].map(([v,l])=>(
            <button key={v} onClick={()=>setStatusF(v)}
              style={{ padding:'5px 10px', borderRadius:7, border:'1px solid', fontSize:12,
                cursor:'pointer', fontFamily:'var(--ui-font)',
                background: statusF===v ? 'var(--accent)' : 'var(--bg-1)',
                borderColor: statusF===v ? 'var(--accent)' : 'var(--line-1)',
                color: statusF===v ? '#fff' : 'var(--fg-1)' }}>
              {l}
            </button>
          ))}
        </div>
        <div style={{ display:'flex', gap:4 }}>
          {[['all','Все приоритеты'], ['high','Высокий'], ['normal','Норм.'], ['low','Низкий']].map(([v,l])=>(
            <button key={v} onClick={()=>setPriorityF(v)}
              style={{ padding:'5px 10px', borderRadius:7, border:'1px solid', fontSize:12,
                cursor:'pointer', fontFamily:'var(--ui-font)',
                background: priorityF===v ? 'var(--bg-2)' : 'transparent',
                borderColor: priorityF===v ? 'var(--line-0)' : 'var(--line-1)',
                color: 'var(--fg-1)' }}>
              {l}
            </button>
          ))}
        </div>
        <span style={{ marginLeft:'auto', fontSize:11, color:'var(--fg-2)' }}>
          {filtered.length} из {data.orders.length}
        </span>
      </div>

      {/* Таблица */}
      <div className="tbl-wrap">
        <table className="tbl">
          <thead>
            <tr>
              <Th col="number" label="Номер"/>
              <th>Получатель / Мастер</th>
              <Th col="status"  label="Статус"/>
              <Th col="due"     label="Срок"/>
              <th className="hide-mobile">Приоритет</th>
              <th className="num-col hide-mobile">Деталей</th>
              <Th col="pct"     label="Прогресс" cls="hide-mobile"/>
              <th style={{width:40}}></th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr><td colSpan="8">
                <div className="empty-state" style={{ border:0 }}>Заказы не найдены</div>
              </td></tr>
            )}
            {filtered.map(o => (
              <tr key={o.id} className="row-hover"
                onClick={() => onOpenOrder(o.id)}
                style={{ cursor:'pointer', opacity: o.status==='done' ? .75 : 1 }}>
                <td>
                  <span className="mono" style={{ fontWeight:700, color:'var(--accent)', fontSize:13 }}>
                    {o.number}
                  </span>
                  {o.overdue && <span style={{ marginLeft:6, fontSize:10, color:'var(--danger)' }}>⚠ просрочен</span>}
                </td>
                <td>
                  <div style={{ fontSize:13 }}>{o.customer}</div>
                  {o.foreman && <div style={{ fontSize:11, color:'var(--fg-2)' }}>{o.foreman}</div>}
                </td>
                <td>
                  <span className={'pill '+STATUS_CLS[o.status]} style={{ fontSize:11 }}>
                    <span className="dot"/>{STATUS_LBL[o.status]}
                  </span>
                </td>
                <td className="mono" style={{ fontSize:12,
                  color: o.overdue ? 'var(--danger)' : 'var(--fg-1)' }}>
                  {o.due||'—'}
                </td>
                <td className="hide-mobile" style={{ fontSize:12, color: PRI_COL[o.priority||'normal'] }}>
                  {PRI_LBL[o.priority||'normal']}
                </td>
                <td className="num-col hide-mobile">
                  <span className="num">{o.detailsCt}</span>
                </td>
                <td className="hide-mobile" style={{ width:160 }}>
                  <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                    <div style={{ flex:1, height:5, background:'var(--bg-3)', borderRadius:3, overflow:'hidden' }}>
                      <div style={{ height:'100%', width:o.pct+'%', borderRadius:3,
                        background: o.pct===100?'var(--st-done-line)':o.pct>50?'var(--st-prog-line)':'var(--accent)' }}/>
                    </div>
                    <span className="mono num" style={{ fontSize:11, minWidth:28 }}>{o.pct}%</span>
                  </div>
                  <div style={{ fontSize:10, color:'var(--fg-2)', marginTop:1 }}>{o.done}/{o.total} оп.</div>
                </td>
                <td onClick={e=>e.stopPropagation()}>
                  <button className="icon-btn" onClick={()=>onOpenOrder(o.id)} title="Открыть заказ">
                    <Icon name="arrow-right" size={14}/>
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </>
  );
}


// =======================================================
// Общий отчёт по заказам
// =======================================================
function ReportView({ data, tasks, scanLog, lang }) {
  const [period,   setPeriod]   = React.useState('all');
  const [sortBy,   setSortBy]   = React.useState('number');
  const [filterSt, setFilterSt] = React.useState('all');

  const STATUS_LBL   = { plan:'Планируется', in_work:'В работе', done:'Выполнен' };
  const STATUS_CLS   = { plan:'wait', in_work:'prog', done:'done' };
  const PRIORITY_LBL = { high:'Высокий', normal:'Нормальный', low:'Низкий' };
  const PRIORITY_COL = { high:'var(--danger)', normal:'var(--fg-1)', low:'var(--fg-2)' };

  // Обогащаем заказы статистикой
  const orders = React.useMemo(() => {
    return data.orders.map(o => {
      const orderTasks = tasks.filter(t => t.orderId === o.id);
      const done     = orderTasks.filter(t => t.status === 'done').length;
      const inProg   = orderTasks.filter(t => t.status === 'in_progress').length;
      const waiting  = orderTasks.filter(t => t.status === 'waiting').length;
      const total    = orderTasks.length;
      const pct      = total > 0 ? Math.round(done / total * 100) : 0;
      const totalMin = orderTasks.reduce((s,t) => s + t.time * t.planned, 0);
      const doneMin  = orderTasks.filter(t=>t.status==='done').reduce((s,t) => s + t.time * t.planned, 0);
      const dueDate  = o.dueDate || o.due_date || '';
      const isOverdue = dueDate && new Date(dueDate) < new Date() && o.status !== 'done';
      const detailsCt = (o.items||[]).length;
      return { ...o, dueDate, done, inProg, waiting, total, pct, totalMin, doneMin, isOverdue, detailsCt };
    });
  }, [data.orders, tasks]);

  // Фильтр + сортировка
  const filtered = React.useMemo(() => {
    let list = [...orders];
    if (filterSt !== 'all') list = list.filter(o => o.status === filterSt);
    if (period === '7d')  list = list.filter(o => o.createdAt && new Date(o.createdAt) >= new Date(Date.now()-7*86400000));
    if (period === '30d') list = list.filter(o => o.createdAt && new Date(o.createdAt) >= new Date(Date.now()-30*86400000));
    list.sort((a,b) => {
      if (sortBy === 'number')   return a.number.localeCompare(b.number);
      if (sortBy === 'status')   return a.status.localeCompare(b.status);
      if (sortBy === 'progress') return b.pct - a.pct;
      if (sortBy === 'due')      return (a.dueDate||'').localeCompare(b.dueDate||'');
      if (sortBy === 'overdue')  return b.isOverdue - a.isOverdue;
      return 0;
    });
    return list;
  }, [orders, filterSt, period, sortBy]);

  // Сводные метрики
  const total    = filtered.length;
  const totalDone   = filtered.filter(o=>o.status==='done').length;
  const totalInWork = filtered.filter(o=>o.status==='in_work').length;
  const totalPlan   = filtered.filter(o=>o.status==='plan').length;
  const overdueCt   = filtered.filter(o=>o.isOverdue).length;
  const avgPct      = total > 0 ? Math.round(filtered.reduce((s,o)=>s+o.pct,0)/total) : 0;
  const totalOps    = filtered.reduce((s,o)=>s+o.total,0);
  const doneOps     = filtered.reduce((s,o)=>s+o.done,0);

  // Excel-экспорт отчёта
  function exportExcel() {
    const XLSX = window.XLSX;
    if (!XLSX) { alert('SheetJS не загружен'); return; }
    const today = new Date().toISOString().slice(0,10);

    // Лист 1: Сводка по заказам
    const summaryRows = [
      ['ОТЧЁТ ПО ЗАКАЗАМ', `Дата: ${today}`],
      [],
      ['Всего заказов', total, 'Выполнено', totalDone, 'В работе', totalInWork, 'Планируется', totalPlan],
      ['Просрочено', overdueCt, 'Средний прогресс', avgPct+'%', 'Всего операций', totalOps, 'Выполнено операций', doneOps],
      [],
      ['Номер', 'Получатель', 'Ст. мастер', 'Статус', 'Приоритет', 'Создан', 'Срок',
       'Деталей', 'Операций', 'Выполнено', 'В работе', 'Ожидает', 'Прогресс %', 'Трудоёмкость (мин)', 'Просрочен'],
      ...filtered.map(o=>[
        o.number, o.customer, o.foreman||'—',
        STATUS_LBL[o.status]||o.status,
        PRIORITY_LBL[o.priority]||o.priority,
        o.createdAt||'', o.dueDate||'',
        o.detailsCt, o.total, o.done, o.inProg, o.waiting, o.pct,
        o.totalMin, o.isOverdue ? 'Да' : 'Нет',
      ]),
    ];
    const ws1 = XLSX.utils.aoa_to_sheet(summaryRows);
    ws1['!cols'] = [{wch:14},{wch:28},{wch:18},{wch:14},{wch:12},{wch:12},{wch:12},
                    {wch:8},{wch:10},{wch:10},{wch:10},{wch:10},{wch:12},{wch:16},{wch:10}];

    // Лист 2: Детализация по операциям
    const opsRows = [
      ['ДЕТАЛИЗАЦИЯ ОПЕРАЦИЙ'],
      [],
      ['Заказ', 'Деталь', 'Код', 'Операция', '№ оп.', 'Раб. центр', 'Плановое кол.', 'Факт', 'Статус', 'Исполнитель', 'Время (мин)'],
      ...tasks.map(t => {
        const order  = data.orders.find(o=>o.id===t.orderId);
        const detail = data.details.find(d=>d.id===t.detailId);
        return [
          order?.number||t.orderId,
          detail?.name||t.detailId,
          detail?.code||'',
          t.opName,
          String(t.opNum).padStart(3,'0'),
          t.workCenter,
          t.planned, t.completed,
          t.status==='done'?'Выполнена':t.status==='in_progress'?'В работе':'Ожидает',
          t.operator||'',
          t.time,
        ];
      }),
    ];
    const ws2 = XLSX.utils.aoa_to_sheet(opsRows);
    ws2['!cols'] = [{wch:14},{wch:30},{wch:14},{wch:28},{wch:8},{wch:18},{wch:10},{wch:8},{wch:14},{wch:18},{wch:10}];

    // Лист 3: Журнал сканирований
    const logRows = [
      ['ЖУРНАЛ СКАНИРОВАНИЙ'],
      [],
      ['Время', 'Деталь', 'Операция', 'Оператор', 'Кол-во', 'QR-код', 'Результат'],
      ...scanLog.map(s=>[s.ts, s.detail, s.op, s.operator, s.quantity, s.qr, s.result==='closed'?'Закрыто':'Ошибка']),
    ];
    const ws3 = XLSX.utils.aoa_to_sheet(logRows);
    ws3['!cols'] = [{wch:10},{wch:16},{wch:28},{wch:20},{wch:8},{wch:24},{wch:12}];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws1, 'Заказы');
    XLSX.utils.book_append_sheet(wb, ws2, 'Операции');
    XLSX.utils.book_append_sheet(wb, ws3, 'Журнал');
    XLSX.writeFile(wb, `Отчёт-${today}.xlsx`);
  }

  function SortTh({ col, label }) {
    return (
      <th style={{ cursor:'pointer', userSelect:'none', whiteSpace:'nowrap' }}
        onClick={()=>setSortBy(col)}>
        {label}{sortBy===col ? ' ▲' : ''}
      </th>
    );
  }

  return (
    <>
      <div className="page-head">
        <div>
          <h1 className="page-title">Отчёт по заказам</h1>
          <div className="page-sub">{total} заказов · {doneOps} из {totalOps} операций выполнено</div>
        </div>
        <div className="row">
          <button className="btn primary" onClick={exportExcel}>
            <Icon name="table" size={14}/>Выгрузить Excel
          </button>
        </div>
      </div>

      {/* KPI-строка */}
      <div className="grid-4" style={{ marginBottom:16 }}>
        <div className="kpi"><div className="kpi-label">Всего заказов</div>
          <div className="kpi-value num">{total}</div>
          <div className="kpi-meta">
            <span className="pill prog" style={{padding:'1px 6px'}}><span className="dot"/>{totalInWork} в работе</span>
          </div>
        </div>
        <div className="kpi"><div className="kpi-label">Выполнено</div>
          <div className="kpi-value num">{totalDone}<span className="unit">/ {total}</span></div>
          <div className="kpi-meta"><span className="num">{total>0?Math.round(totalDone/total*100):0}%</span></div>
        </div>
        <div className="kpi"><div className="kpi-label">Операций</div>
          <div className="kpi-value num">{doneOps}<span className="unit">/ {totalOps}</span></div>
          <div className="kpi-meta">средний прогресс <b className="num">{avgPct}%</b></div>
        </div>
        <div className="kpi" style={{ borderColor: overdueCt > 0 ? 'var(--danger)' : undefined }}>
          <div className="kpi-label">Просрочено</div>
          <div className="kpi-value num" style={{ color: overdueCt > 0 ? 'var(--danger)' : undefined }}>
            {overdueCt}
          </div>
          <div className="kpi-meta">{totalPlan} планируется</div>
        </div>
      </div>

      {/* Фильтры */}
      <div style={{ display:'flex', gap:10, marginBottom:14, flexWrap:'wrap', alignItems:'center' }}>
        <div style={{ display:'flex', gap:4 }}>
          {[['all','Все'], ['in_work','В работе'], ['plan','Планируется'], ['done','Выполнен']].map(([v,l])=>(
            <button key={v} onClick={()=>setFilterSt(v)}
              style={{ padding:'5px 12px', borderRadius:7, border:'1px solid', fontSize:12,
                cursor:'pointer', fontFamily:'var(--ui-font)',
                background: filterSt===v ? 'var(--accent)' : 'var(--bg-1)',
                borderColor: filterSt===v ? 'var(--accent)' : 'var(--line-1)',
                color: filterSt===v ? '#fff' : 'var(--fg-1)' }}>
              {l}
            </button>
          ))}
        </div>
        <div style={{ width:1, height:20, background:'var(--line-1)' }}/>
        <div style={{ display:'flex', gap:4 }}>
          {[['all','Всё время'], ['30d','30 дней'], ['7d','7 дней']].map(([v,l])=>(
            <button key={v} onClick={()=>setPeriod(v)}
              style={{ padding:'5px 12px', borderRadius:7, border:'1px solid', fontSize:12,
                cursor:'pointer', fontFamily:'var(--ui-font)',
                background: period===v ? 'var(--bg-2)' : 'transparent',
                borderColor: period===v ? 'var(--line-0)' : 'var(--line-1)',
                color: 'var(--fg-1)' }}>
              {l}
            </button>
          ))}
        </div>
        <span style={{ marginLeft:'auto', fontSize:12, color:'var(--fg-2)' }}>
          {filtered.length} записей
        </span>
      </div>

      {/* Таблица заказов */}
      <div className="tbl-wrap" style={{ marginBottom:24, WebkitOverflowScrolling:"touch" }}>
        <table className="tbl">
          <thead>
            <tr>

              <SortTh col="due"      label="Срок"/>
              <SortTh col="overdue"  label="Просрочен"/>
              <th>Приоритет</th>
              <th className="num-col">Деталей</th>
              <SortTh col="progress" label="Прогресс"/>
              <th style={{width:140}}>Операции</th>
              <th className="num-col hide-mobile">Трудоёмк.</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(o => (
              <tr key={o.id} className="row-hover" style={{ opacity: o.status==='done' ? .7 : 1 }}>
                <td>
                  <span className="mono" style={{ fontWeight:700, color:'var(--accent)' }}>{o.number}</span>

                </td>
                <td>
                  <span className={'pill '+STATUS_CLS[o.status]} style={{ fontSize:11 }}>

                </td>
                <td className="mono" style={{ fontSize:12, color: o.isOverdue ? 'var(--danger)' : 'var(--fg-1)' }}>

                </td>
                <td style={{ fontSize:12, color: PRIORITY_COL[o.priority] }}>
                  {PRIORITY_LBL[o.priority]||'—'}
                </td>
                <td className="num-col num">{o.detailsCt}</td>
                <td style={{ width:160 }}>
                  <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <div style={{ flex:1, height:6, background:'var(--bg-3)', borderRadius:3, overflow:'hidden' }}>
                      <div style={{ height:'100%', borderRadius:3, width:o.pct+'%',

                        transition:'width .3s' }}/>
                    </div>

                  </div>

                </td>
                <td className="num-col hide-mobile">
                  <span className="num" style={{ fontSize:12 }}>{Math.round(o.totalMin/60)}ч</span>
                  <span style={{ fontSize:10, color:'var(--fg-2)' }}> {o.totalMin%60}мин</span>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* График прогресса — простой горизонтальный bar chart */}
      {filtered.length > 0 && filtered.length <= 20 && (
        <div className="card" style={{ padding:'16px 18px' }}>
          <div className="subhead" style={{ marginTop:0 }}>Прогресс по заказам</div>
          <div style={{ display:'flex', flexDirection:'column', gap:8, marginTop:8 }}>
            {filtered.map(o => (
              <div key={o.id} style={{ display:'flex', alignItems:'center', gap:10 }}>
                <span className="mono" style={{ fontSize:11, width:100, flexShrink:0, color:'var(--accent)', fontWeight:600 }}>
                  {o.number}
                </span>
                <div style={{ flex:1, height:18, background:'var(--bg-3)', borderRadius:4, overflow:'hidden', position:'relative' }}>
                  <div style={{ height:'100%', borderRadius:4, width:o.pct+'%',
                    background: o.pct===100 ? 'var(--st-done-line)' : o.pct>50 ? 'var(--st-prog-line)' : 'var(--accent)',
                    transition:'width .5s ease', opacity:.85 }}/>
                  {o.pct > 8 && (
                    <span style={{ position:'absolute', left:8, top:0, lineHeight:'18px',
                      fontSize:10, color:'#fff', fontWeight:600, mixBlendMode:'plus-lighter' }}>
                      {o.pct}%
                    </span>
                  )}
                </div>
                <span className={'pill '+STATUS_CLS[o.status]} style={{ fontSize:10, flexShrink:0 }}>
                  <span className="dot"/>{o.done}/{o.total}
                </span>
                {o.isOverdue && <span style={{ fontSize:11, color:'var(--danger)', flexShrink:0 }}>⚠</span>}
              </div>
            ))}
          </div>
        </div>
      )}
    </>
  );
}



  </script>
  <script type="text/babel" data-presets="react">
// scanner.jsx — Mobile-frame QR scanner with jsQR + manual fallback
// Note: Icon, QrCode are global consts from icons.jsx / qr.jsx.

function Scanner({ data, tasks, scanLog, lang, qrSize, onScanResult, users }) {
  const S = window.useStrings(lang);
  const videoRef   = React.useRef(null);
  const canvasRef  = React.useRef(null);
  const streamRef  = React.useRef(null);
  const rafRef     = React.useRef(null);
  const lastScanRef = React.useRef({ text: '', at: 0 });

  const [cameraOn,    setCameraOn]    = React.useState(false);
  const [cameraError, setCameraError] = React.useState(null);
  const [detected,    setDetected]    = React.useState(null);   // {qrText, task}
  const [pendingClose,setPendingClose]= React.useState(null);
  const [manualValue, setManualValue] = React.useState('');
  const [closing,     setClosing]     = React.useState(false);

  // Map qrText → task for fast lookup
  const tasksByQr = React.useMemo(() => {
    const m = new Map();
    tasks.forEach(t => m.set(t.qrText, t));
    return m;
  }, [tasks]);

  // Camera start/stop
  React.useEffect(() => {
    if (!cameraOn) return;
    let cancelled = false;

    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 720 }, height: { ideal: 720 } },
          audio: false,
        });
        if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
        streamRef.current = stream;
        const video = videoRef.current;
        if (video) { video.srcObject = stream; await video.play(); tick(); }
      } catch (err) {
        if (!cancelled) { setCameraError(err.message || String(err)); setCameraOn(false); }
      }
    }

    function tick() {
      if (cancelled) return;
      const video  = videoRef.current;
      const canvas = canvasRef.current;
      if (video && canvas && video.readyState >= 2 && window.jsQR) {
        const w = video.videoWidth, h = video.videoHeight;
        if (w && h) {
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(video, 0, 0, w, h);
          const img  = ctx.getImageData(0, 0, w, h);
          const code = window.jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
          if (code?.data && code.data !== lastScanRef.current.text) {
            const now = Date.now();
            if (now - lastScanRef.current.at > 800) {
              lastScanRef.current = { text: code.data, at: now };
              handleDetect(code.data);
            }
          }
        }
      }
      rafRef.current = requestAnimationFrame(tick);
    }

    start();
    return () => {
      cancelled = true;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
    };
  }, [cameraOn]);

  function handleDetect(text) {
    const task = tasksByQr.get(text) || null;
    setDetected({ qrText: text, task });
  }

  function resetDetected() {
    setDetected(null);
    lastScanRef.current = { text: '', at: 0 };
  }

  function handleEnableCamera() {
    setCameraError(null);
    setCameraOn(true);
  }

  // Confirm action — called from modal with qty + operator + action + comment + closeStatus
  async function confirmClose(qty, operator, action, comment, closeStatus) {
    if (!detected?.task) return;
    setClosing(true);
    try {
      await onScanResult(detected.task.id, detected.qrText, qty, operator, action, comment || '', closeStatus || 'done');
    } finally {
      setClosing(false);
      setPendingClose(null);
      resetDetected();
    }
  }

  // Manual input submit
  function handleManualSubmit() {
    const v = manualValue.trim();
    if (!v) return;
    handleDetect(v);
    setManualValue('');
  }

  const detail = detected?.task ? data.details.find(d => d.id === detected.task.detailId) : null;

  return (
    <React.Fragment>
      {/* ── Header ── */}
      <div className="page-head">
        <div>
          <h1 className="page-title">{S.navScan}</h1>
          <div className="page-sub">{lang === 'en' ? 'Scan QR codes from the route sheet to close operations' : 'Сканируйте QR-коды с маршрутного листа для закрытия операций'}</div>
        </div>
        <div className="row">
          {cameraOn
            ? <button className="btn" onClick={() => setCameraOn(false)}><Icon name="pause" size={14}/>{lang === 'en' ? 'Stop' : 'Стоп'}</button>
            : <button className="btn primary" onClick={handleEnableCamera}><Icon name="camera" size={14}/>{S.enableCam}</button>
          }
        </div>
      </div>

      <div className="scanner-stage">
        {/* ── Phone frame ── */}
        <div>
          <div className="phone-frame">
            <div className="phone-screen">
              <div className="scan-statusbar">
                <span>09:42</span>
                <div className="icons">
                  <Icon name="signal" size={14}/>
                  <Icon name="wifi" size={14}/>
                  <Icon name="battery" size={22}/>
                </div>
              </div>
              <div className="scan-titlebar">
                <button className="iconbtn"><Icon name="arrow-left" size={16}/></button>
                <span>{lang === 'en' ? 'Scan operation' : 'Сканирование'}</span>
                <button className="iconbtn"><Icon name="flash" size={16}/></button>
              </div>

              <div className="scan-camview">
                {/* Video element — always rendered so ref is stable */}
                <video ref={videoRef} playsInline muted
                  style={{ display: cameraOn ? 'block' : 'none',
                    position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover' }} />
                <canvas ref={canvasRef} style={{ display:'none' }} />

                {/* Placeholder when camera off */}
                {!cameraOn && (
                  <div className="scan-fake" style={{ position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:8,color:'var(--fg-2)' }}>
                    <Icon name="camera" size={32}/>
                    <div style={{ fontSize:12 }}>{S.cameraOff}</div>
                  </div>
                )}

                {/* Scan overlay — pointer-events:none so camera button is clickable */}
                <div className="scan-overlay" style={{ pointerEvents:'none' }}>
                  <div className="scan-mask-top"/>
                  <div className="scan-mask-mid">
                    <div className="scan-mask-side"/>
                    <div className="scan-window">
                      <div className="scan-corner tl"/><div className="scan-corner tr"/>
                      <div className="scan-corner bl"/><div className="scan-corner br"/>
                      {cameraOn && <div className="scan-line"/>}
                    </div>
                    <div className="scan-mask-side"/>
                  </div>
                  <div className="scan-mask-bottom"/>
                </div>

                {/* Bottom action area — pointer-events:auto */}
                <div style={{ position:'absolute',bottom:0,left:0,right:0,padding:'0 12px 12px',zIndex:10 }}>
                  {!cameraOn && !cameraError && !detected && (
                    <button className="scan-fab" style={{ width:'100%',justifyContent:'center' }}
                      onClick={handleEnableCamera}>
                      <Icon name="camera" size={16}/>{S.enableCam}
                    </button>
                  )}
                  {cameraError && (
                    <div style={{ background:'rgba(0,0,0,.7)',borderRadius:8,padding:'10px 12px',fontSize:12,color:'#ffb579',marginBottom:8 }}>
                      {lang === 'en' ? 'Camera error: ' : 'Ошибка камеры: '}{cameraError}
                      <button className="btn" style={{ marginTop:8,width:'100%',justifyContent:'center' }}
                        onClick={handleEnableCamera}>
                        {lang === 'en' ? 'Retry' : 'Повторить'}
                      </button>
                    </div>
                  )}
                  {detected && detected.task && (
                    <div className="scan-card">
                      <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center' }}>
                        <span className={
                          'pill ' + (detected.task.status === 'done' ? 'done' : detected.task.status === 'in_progress' ? 'prog' : 'wait')
                        }><span className="dot"/>
                          {detected.task.status === 'done'
                            ? (lang === 'en' ? 'Done' : 'Выполнена')
                            : detected.task.status === 'in_progress'
                            ? (lang === 'en' ? 'In progress' : 'В работе')
                            : (lang === 'en' ? 'Waiting' : 'Ожидает')}
                        </span>
                        <button onClick={resetDetected}
                          style={{ background:'transparent',border:0,color:'rgba(255,255,255,.5)',cursor:'pointer',fontSize:18,lineHeight:1 }}>✕</button>
                      </div>
                      <div style={{ fontSize:14,fontWeight:600,color:'#f3eee2',margin:'6px 0 4px' }}>
                        <span className="mono" style={{ color:'var(--accent)' }}>{String(detected.task.opNum).padStart(3,'0')}</span> {detected.task.opName}
                      </div>
                      <div className="scan-card-row"><span className="k">{S.detail}:</span><span className="v">{detail?.name}</span></div>
                      <div className="scan-card-row"><span className="k">{S.workCenter}:</span><span className="v mono">{detected.task.workCenter}</span></div>
                      <div className="scan-card-row"><span className="k">{S.qtyShort}:</span><span className="v num">{detected.task.completed}/{detected.task.planned} {S.pcs}</span></div>
                      {detected.task.status === 'done' ? (
                        <div style={{ textAlign:'center',fontSize:12,color:'rgba(255,255,255,.5)',marginTop:8,padding:'6px 0' }}>
                          {lang === 'en' ? 'Operation already closed' : 'Операция уже закрыта'}
                        </div>
                      ) : (
                        <div style={{ display:'flex',flexDirection:'column',gap:6,marginTop:8 }}>
                          {detected.task.status === 'waiting' && (
                            <button className="scan-fab" style={{ width:'100%',justifyContent:'center',background:'#3b82f6' }}
                              onClick={() => setPendingClose({ ...detected, action: 'start' })}>
                              <Icon name="arrow-right" size={15}/>{lang === 'en' ? 'Start operation' : 'Взять в работу'}
                            </button>
                          )}
                          <button className="scan-fab" style={{ width:'100%',justifyContent:'center' }}
                            onClick={() => setPendingClose({ ...detected, action: 'close' })}>
                            <Icon name="check" size={15}/>{S.closeOp}
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                  {detected && !detected.task && (
                    <div className="scan-card">
                      <span className="pill block"><span className="dot"/>{S.noTask}</span>
                      <div style={{ fontSize:11,color:'rgba(255,255,255,.5)',margin:'4px 0',wordBreak:'break-all' }}>{detected.qrText}</div>
                      <button className="btn" style={{ width:'100%',justifyContent:'center',marginTop:6 }} onClick={resetDetected}>{S.cancel}</button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* ── Side panel ── */}
        <div className="stack">
          {/* Manual input */}
          <div className="card">
            <div className="card-head">
              <h3 className="card-title" style={{ fontSize:12 }}>{S.manualEntry}</h3>
              <span className="muted" style={{ fontSize:10.5 }}>{lang === 'en' ? 'Keyboard scanner / manual' : 'Сканер-клавиатура / вручную'}</span>
            </div>
            <div className="row" style={{ gap:6 }}>
              <input className="input mono" placeholder="OTASK:001-001-10"
                value={manualValue} onChange={e => setManualValue(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleManualSubmit()}
                style={{ flex:1, fontSize:11 }} />
              <button className="btn primary" onClick={handleManualSubmit}>
                <Icon name="arrow-right" size={14}/>
              </button>
            </div>

            {/* Demo QR codes */}
            {tasks.filter(t => t.status !== 'done').length > 0 && (
              <React.Fragment>
                <div className="subhead" style={{ marginTop:14 }}>
                  {lang === 'en' ? 'Click to simulate scan (demo)' : 'Кликните для симуляции скана'}
                </div>
                <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
                  {tasks.filter(t => t.status !== 'done').slice(0,4).map(t => (
                    <div key={t.id} onClick={() => handleDetect(t.qrText)} title={t.qrText}
                      style={{ cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',
                        gap:4,padding:6,border:'1px solid var(--line-1)',borderRadius:6,background:'var(--bg-1)' }}>
                      <QrCode text={t.qrText} size={56}/>
                      <div className="mono" style={{ fontSize:9,color:'var(--fg-2)' }}>op {String(t.opNum).padStart(3,'0')}</div>
                    </div>
                  ))}
                </div>
              </React.Fragment>
            )}
          </div>

          {/* Scan log */}
          <div className="scan-log">
            <div className="scan-log-head">
              <div>
                <div style={{ fontSize:13,fontWeight:600 }}>{S.log}</div>
                <div className="muted" style={{ fontSize:10.5 }}>{lang === 'en' ? 'Live feed of QR closures' : 'Лента закрытия операций'}</div>
              </div>
              <span className="pill prog"><span className="dot"/>{cameraOn ? (lang==='en'?'live':'эфир') : (lang==='en'?'idle':'покой')}</span>
            </div>
            <div className="scan-log-body">
              {scanLog.length === 0
                ? <div className="empty-state" style={{ borderRadius:0,border:0 }}>—</div>
                : scanLog.map((s,i) => (
                  <div key={i} className="scan-log-row">
                    <div className="ts">{String(s.ts).slice(-5)}</div>
                    <div>
                      <div className="label"><span className="mono" style={{ color:'var(--accent)' }}>{s.op?.split(' ')[0]} </span>{s.op?.split(' ').slice(1).join(' ')}</div>
                      <div className="meta">{s.detail} · {s.operator} · {s.quantity} {S.pcs}</div>
                    </div>
                    <Icon name="check" size={14} style={{ color:'var(--st-prog-line)' }}/>
                  </div>
                ))
              }
            </div>
          </div>
        </div>
      </div>

      {/* ── Close operation modal ── */}
      {pendingClose && (
        <CloseOpModal
          task={pendingClose.task}
          detail={data.details.find(d => d.id === pendingClose.task?.detailId)}
          qrText={pendingClose.qrText}
          lang={lang}
          closing={closing}
          action={pendingClose.action || 'close'}
          users={users}
          onConfirm={confirmClose}
          onCancel={() => setPendingClose(null)}
        />
      )}
    </React.Fragment>
  );
}

function CloseOpModal({ task, detail, qrText, lang, closing, action, onConfirm, onCancel, users }) {
  const S = window.useStrings(lang);
  const [qty, setQty]           = React.useState(task.planned - task.completed);
  const [operator, setOperator] = React.useState(task.operator || '');
  const [comment, setComment]   = React.useState('');
  const [closeStatus, setCloseStatus] = React.useState('done');
  const isStart = action === 'start';



  const title = isStart
    ? (lang === 'en' ? 'Start operation?' : 'Взять в работу?')
    : S.closeOpQ;

  const confirmLabel = isStart
    ? (lang === 'en' ? 'Start' : 'В работу')
    : S.confirm;

  const hint = isStart
    ? (lang === 'en'
        ? `Operation will be marked "In progress". Operator will be assigned.`
        : `Операция перейдёт в статус «В работе». Оператор будет назначен.`)
    : (lang === 'en'
        ? `Operation will be marked done (${qty}/${task.planned} pc) and logged.`
        : `Операция перейдёт в «Выполнена» (${qty}/${task.planned} шт.) и запишется в журнал.`);

  return (
    <div className="modal-back" onClick={onCancel}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{ width:480 }}>
        <div className="modal-head">
          <h3 className="modal-title">{title}</h3>
          <button className="icon-btn" onClick={onCancel}><Icon name="close" size={16}/></button>
        </div>
        <div className="modal-body">
          <div className="row" style={{ gap:16,alignItems:'flex-start' }}>
            <QrCode text={qrText} size={100}/>
            <div style={{ flex:1 }}>
              <div className="muted mono" style={{ fontSize:10.5 }}>{qrText}</div>
              <div style={{ fontSize:16,fontWeight:600,marginTop:4 }}>
                <span className="mono" style={{ color:'var(--accent)' }}>{String(task.opNum).padStart(3,'0')}</span> {task.opName}
              </div>
              <div style={{ marginTop:4,fontSize:12,color:'var(--fg-1)' }}>{detail?.name} · <span className="mono">{detail?.code}</span></div>
              <div style={{ marginTop:4,fontSize:11,color:'var(--fg-2)' }}>{task.workCenter}</div>
            </div>
          </div>
          <div style={{ marginTop:18,display:'grid',gridTemplateColumns: isStart ? '1fr' : '1fr 1fr',gap:12 }}>
            {!isStart && (
              <div className="field">
                <span className="field-label">{lang === 'en' ? 'Qty accepted' : 'Принято (шт.)'}</span>
                <input className="input num" type="number" value={qty} min={0} max={task.planned}
                  onChange={e => setQty(parseInt(e.target.value)||0)}/>
              </div>
            )}
            <div className="field">
              <span className="field-label">{lang === 'en' ? 'Operator' : 'Исполнитель'}</span>
              <datalist id="operators-list">
                {(users || []).map(u => <option key={u.id} value={u.name}/>)}
              </datalist>
              <input
                className="input"
                list="operators-list"
                value={operator}
                onChange={e => setOperator(e.target.value)}
                placeholder={lang === 'en' ? 'Enter name…' : 'Введите имя…'}
                style={{ width:'100%' }}
              />
            </div>
          </div>
          {!isStart && (
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginTop:4 }}>
              <div className="field">
                <span className="field-label">{lang === 'en' ? 'Result' : 'Результат'}</span>
                <select className="select" value={closeStatus} onChange={e=>setCloseStatus(e.target.value)} style={{width:'100%'}}>
                  <option value="done">{lang === 'en' ? 'Done' : 'Выполнена'}</option>
                  <option value="rejected">{lang === 'en' ? 'Rejected (defect)' : 'Брак'}</option>
                  <option value="rework">{lang === 'en' ? 'Rework required' : 'Переделка'}</option>
                  <option value="paused">{lang === 'en' ? 'Paused (no material)' : 'Пауза (нет материала)'}</option>
                </select>
              </div>
              <div className="field">
                <span className="field-label">{lang === 'en' ? 'Comment' : 'Комментарий'}</span>
                <input className="input" value={comment} onChange={e=>setComment(e.target.value)}
                  placeholder={lang === 'en' ? 'Optional note…' : 'Замечание…'}
                  style={{ width:'100%' }}/>
              </div>
            </div>
          )}
          <div className="alert" style={{ marginTop:14 }}>
            <Icon name="check" size={14}/>
            <span>{hint}</span>
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn" onClick={onCancel} disabled={closing}>{S.cancel}</button>
          <button className="btn primary"
            style={ isStart ? { background:'#3b82f6',borderColor:'#3b82f6' } : {} }
            onClick={() => onConfirm(qty, operator, action, comment, closeStatus)} disabled={closing}>
            <Icon name="check" size={14}/>{closing ? (lang==='en'?'Saving…':'Сохранение…') : confirmLabel}
          </button>
        </div>
      </div>
    </div>
  );
}

window.Scanner = Scanner;

  </script>
  <script type="text/babel" data-presets="react">
// app.jsx — root component, routing, state, tweaks

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "density": "compact",
  "lang": "ru",
  "qrSize": 70,
  "accent": "#d9480f"
}/*EDITMODE-END*/;

// ── API layer ────────────────────────────────────────────────────────
const API_BASE = '/api';

const Auth = {
  _token: null,
  // refresh_token теперь в HttpOnly cookie — браузер отправляет его автоматически
  // localStorage хранит только несекретные данные о пользователе (не токены)
  getToken:   () => Auth._token,
  setToken:   (t) => { Auth._token = t; },
  getRefresh: () => null,    // cookie читает только сервер
  setRefresh: (t) => {},     // сервер сам устанавливает cookie
  getUser:    () => { try { return JSON.parse(localStorage.getItem('auth_user') || 'null'); } catch { return null; } },
  setUser:    (u) => localStorage.setItem('auth_user', JSON.stringify(u)),
  clear:      () => { Auth._token = null; localStorage.removeItem('auth_user'); },
  can:        (p) => { const u = Auth.getUser(); return u?.permissions?.includes(p) ?? false; },
  isAdmin:    () => Auth.getUser()?.role === 'admin',
  isLoggedIn: () => !!Auth.getUser() || !!Auth._token,
};

let _onAuthExpired = null;

const api = {
  async _fetch(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    const token = Auth.getToken();
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const opts = { method, headers };
    if (body !== undefined) opts.body = JSON.stringify(body);
    let r = await fetch(API_BASE + path, opts);
    if (r.status === 401 && Auth.getUser()) {
      const ref = await fetch(API_BASE + '/auth/refresh', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      if (ref.ok) {
        const d = await ref.json();
        Auth.setToken(d.access_token); Auth.setRefresh(d.refresh_token);
        headers['Authorization'] = 'Bearer ' + d.access_token;
        r = await fetch(API_BASE + path, { ...opts, headers });
      } else { Auth.clear(); _onAuthExpired?.(); throw new Error('Session expired'); }
    }
    if (!r.ok) { const t = await r.text(); let m = t; try { m = JSON.parse(t).error || t; } catch {} throw new Error(m); }
    return r.json();
  },
  get:    (p)    => api._fetch('GET',    p),
  post:   (p, b) => api._fetch('POST',   p, b),
  put:    (p, b) => api._fetch('PUT',    p, b),
  patch:  (p, b) => api._fetch('PATCH',  p, b),
  delete: (p)    => api._fetch('DELETE', p),
};
window.__api = api;

          <div className="field"><span className="field-label">{isEn?'Code *':'Код *'}</span><input className="input" value={code} onChange={e=>setCode(e.target.value)} placeholder="ФЛ-100-08"/></div>
          <div className="field"><span className="field-label">{isEn?'Unit':'Ед.'}</span><input className="input" value={unit} onChange={e=>setUnit(e.target.value)}/></div>
          <div className="field"><span className="field-label">{isEn?'Drawing':'Чертёж'}</span><input className="input" value={drawing} onChange={e=>setDrawing(e.target.value)}/></div>
        </div>
        <div className="field"><span className="field-label">{isEn?'Name *':'Наименование *'}</span><input className="input" value={name} onChange={e=>setName(e.target.value)}/></div>
        <div className="field"><span className="field-label">{isEn?'Material *':'Материал *'}</span><input className="input" value={material} onChange={e=>setMaterial(e.target.value)}/></div>
        <div>
          <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8 }}>
            <b style={{ fontSize:13 }}>{isEn?'Operations':'Операции'}</b>
            <button className="btn ghost" onClick={addOp}><Icon name="plus" size={13}/>{isEn?'Add':'Добавить'}</button>
          </div>
          <table className="tbl" style={{ fontSize:12 }}>
            <thead><tr><th style={{width:48}}>№</th><th>{isEn?'Operation':'Операция'}</th><th>{isEn?'Work center':'Раб. центр'}</th><th style={{width:64}}>{isEn?'Min':'Мин'}</th><th style={{width:32}}></th></tr></thead>
            <tbody>{ops.map((op,idx)=>(
              <tr key={idx}>
                <td><input className="input" type="number" value={op.num} onChange={e=>updateOp(idx,'num',e.target.value)} style={{width:44,padding:'2px 4px'}}/></td>
                <td><input className="input" value={op.name} onChange={e=>updateOp(idx,'name',e.target.value)} placeholder={isEn?'Turning':'Токарная'} style={{width:'100%'}}/></td>
                <td><input className="input" value={op.workCenter} onChange={e=>updateOp(idx,'workCenter',e.target.value)} placeholder="ДИП-300 №3" style={{width:'100%'}}/></td>
                <td><input className="input" type="number" min="0" value={op.time} onChange={e=>updateOp(idx,'time',e.target.value)} style={{width:52,padding:'2px 4px'}}/></td>
                <td><button className="icon-btn" onClick={()=>removeOp(idx)}><Icon name="trash" size={12}/></button></td>
              </tr>
            ))}</tbody>
          </table>
        </div>
        {err && <div style={{ color:'var(--danger)',fontSize:12 }}>{err}</div>}
        <div style={{ display:'flex',gap:8,justifyContent:'flex-end' }}>
          <button className="btn" onClick={onClose}>{isEn?'Cancel':'Отмена'}</button>
          <button className="btn primary" onClick={handleSave} disabled={saving}>{saving?(isEn?'Saving…':'Сохранение…'):(isEn?'Create':'Создать')}</button>
        </div>
      </div>
    </div>
  );
}

// ── Admin Panel ───────────────────────────────────────────────────────
const ROLE_COLORS = { admin:'var(--accent)', foreman:'#3b82f6', operator:'#10b981', viewer:'var(--fg-2)' };

function AdminPanel({ lang, onBack }) {
  const [tab, setTab]               = React.useState('users');
  const [users, setUsers]           = React.useState([]);
  const [roles, setRoles]           = React.useState([]);
  const [permissions, setPerms]     = React.useState([]);
  const [orders, setOrders]         = React.useState([]);
  const [details, setDetails]       = React.useState([]);
  const [editUser, setEditUser]     = React.useState(null);
  const [editRole, setEditRole]     = React.useState(null);
  const [editOrder, setEditOrder]   = React.useState(null);
  const [editDetail, setEditDetail] = React.useState(null);
  const [loading, setLoading]       = React.useState(true);
  const [toast, setToast]           = React.useState('');
  const [confirm, setConfirm]       = React.useState(null);

  function showToast(msg) { setToast(msg); setTimeout(()=>setToast(''), 3000); }

  async function load() {
    setLoading(true);
    try {
      const [ur, rr, pr, or_, dr] = await Promise.all([
        api.get('/admin/users'), api.get('/admin/roles'), api.get('/admin/permissions'),
        api.get('/orders'), api.get('/details'),
      ]);
      setUsers(ur.data); setRoles(rr.data); setPerms(pr.data);
      setOrders(or_.data); setDetails(dr.data);
    } catch(e) { showToast('Ошибка: '+e.message); }
    setLoading(false);
  }
  React.useEffect(()=>{ load(); }, []);

  // ── User Editor ────────────────────────────────────────────────────
  function UserEditor({ user, roles, onSave, onClose }) {
    const isNew = !user?.id;
    const [name,     setName]     = React.useState(user?.name    || '');
    const [email,    setEmail]    = React.useState(user?.email   || '');
    const [roleId,   setRoleId]   = React.useState(user?.role_id || 3);
    const [active,   setActive]   = React.useState(user?.is_active ?? 1);
    const [password, setPassword] = React.useState('');
    const [err, setErr]           = React.useState('');
    const [saving, setSaving]     = React.useState(false);

    async function save() {
      setSaving(true); setErr('');
      try {
        const body = { name, email, role_id:Number(roleId), is_active:Number(active) };
        if (password) body.password = password;
        if (isNew) { body.password = password || 'Password1!'; await api.post('/admin/users', body); }
        else { await api.put('/admin/users/'+user.id, body); }
        onSave(); onClose();
      } catch(e) { setErr(e.message); }
      setSaving(false);
    }

    return (
      <div style={{ position:'fixed',inset:0,zIndex:2000,background:'rgba(0,0,0,0.6)',display:'flex',alignItems:'center',justifyContent:'center' }}>

          <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center' }}>
            <b style={{ fontSize:15 }}>{isNew?'Новый пользователь':'Редактировать'}</b>
            <button className="icon-btn" onClick={onClose}><Icon name="close" size={16}/></button>
          </div>
          <div className="field"><span className="field-label">Имя *</span><input className="input" value={name} onChange={e=>setName(e.target.value)}/></div>
          <div className="field"><span className="field-label">Email *</span><input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)}/></div>
          <div className="field"><span className="field-label">{isNew?'Пароль *':'Новый пароль (пусто = не менять)'}</span><input className="input" type="password" value={password} onChange={e=>setPassword(e.target.value)}/></div>
          <div className="field"><span className="field-label">Роль</span>
            <select className="select" value={roleId} onChange={e=>setRoleId(e.target.value)} style={{width:'100%'}}>
              {roles.map(r=><option key={r.id} value={r.id}>{r.label}</option>)}
            </select></div>
          <div style={{ display:'flex',alignItems:'center',gap:8 }}>
            <input type="checkbox" id="ua" checked={!!active} onChange={e=>setActive(e.target.checked?1:0)}/>

          </div>
          {err && <div style={{ fontSize:12,color:'var(--danger)' }}>{err}</div>}

            <button className="btn" onClick={onClose}>Отмена</button>
            <button className="btn primary" onClick={save} disabled={saving}>{saving?'Сохранение…':'Сохранить'}</button>
          </div>
        </div>
      </div>
    );
  }

  // ── Role Editor ────────────────────────────────────────────────────
  function RoleEditor({ role, allPermissions, onSave, onClose }) {
    const grouped = allPermissions.reduce((acc,p)=>{ (acc[p.group_name]=acc[p.group_name]||[]).push(p); return acc; }, {});
    const groupLabels = { orders:'Заказы', details:'Номенклатура', scanner:'Сканер', log:'Журнал', admin:'Администрирование' };
    const [selected, setSelected] = React.useState(new Set(role.permissions));
    const [saving, setSaving] = React.useState(false);

    function toggle(name) { setSelected(prev=>{ const s=new Set(prev); s.has(name)?s.delete(name):s.add(name); return s; }); }

    async function save() {
      setSaving(true);
      try { await api.put('/admin/roles/'+role.id+'/permissions', { permissions:[...selected] }); onSave(); onClose(); }
      catch(e) { alert(e.message); }
      setSaving(false);
    }

    return (
      <div style={{ position:'fixed',inset:0,zIndex:2000,background:'rgba(0,0,0,0.6)',display:'flex',alignItems:'center',justifyContent:'center' }}>
        <div className="card" style={{ width:500,maxHeight:'80vh',overflowY:'auto',padding:24,display:'flex',flexDirection:'column',gap:16 }}>
          <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center' }}>

          </div>
          {Object.entries(grouped).map(([grp, perms])=>(
            <div key={grp}>
              <div className="subhead" style={{ margin:'0 0 6px' }}>{groupLabels[grp]||grp}</div>
              {perms.map(p=>(
                <label key={p.name} style={{ display:'flex',alignItems:'center',gap:8,padding:'5px 0',cursor:'pointer',fontSize:13 }}>
                  <input type="checkbox" checked={selected.has(p.name)} onChange={()=>toggle(p.name)}/>

                  <span className="mono muted" style={{ fontSize:11,marginLeft:'auto' }}>{p.name}</span>
                </label>

            <button className="btn" onClick={onClose}>Отмена</button>

        </div>

            <button className="btn primary" style={{ background:'var(--danger)',borderColor:'var(--danger)' }}

          </div>
        </div>

                  <td>

  function DetailsTab() {

      <div style={{ padding:24,maxWidth:960,margin:'0 auto' }}>

              <b style={{ fontSize:16 }}>Пользователи ({users.length})</b>
              <button className="btn primary" onClick={()=>setEditUser({})}><Icon name="plus" size={14}/>Добавить</button>
            </div>
            <div className="tbl-wrap">
              <table className="tbl">
                <thead><tr><th>Имя</th><th>Email</th><th>Роль</th><th>Активен</th><th>Последний вход</th><th style={{width:80}}></th></tr></thead>
                <tbody>{users.map(u=>(
                  <tr key={u.id} className="row-hover">

                    <td><span style={{ fontSize:12,fontWeight:600,color:ROLE_COLORS[u.role]||'var(--fg-1)' }}>{u.role_label}</span></td>
