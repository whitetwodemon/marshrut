services:
  - type: web
    name: marshrut
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: marshrut-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: marshrut-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: marshrut-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: marshrut-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: marshrut-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@marshrut.local
      - key: ADMIN_PASSWORD
        value: Admin1234!
    healthCheckPath: /health

databases:
  - name: marshrut-db
    databaseName: marshrut
    user: marshrut
